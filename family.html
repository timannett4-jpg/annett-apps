<meta name="mobile-web-app-capable" content="yes">

<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<script>window.ANNETT_APP="family";

addEventListener('error',function(e){var t=e.target;if(t&&t.tagName==='IMG'&&/_blob\//.test(t.src)){var f=t.closest('figure,.shot');(f||t).style.display='none';}},true);</script>

<body>
<title>Annett Family Hub</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Built like Tim's BDM dashboard: dark side menu on laptop/iPad, bottom tabs on phone, quick-add buttons in a
   top bar, and a Today landing page. Family colours: dark indigo menu with a coral accent (the BDM is
   black and yellow, so the two apps are easy to tell apart). Always light. */
:root{color-scheme:light;
  --bg:#f2f1f7; --surface:#ffffff; --sunk:#f7f6fb; --line:#e5e3ef; --line2:#d6d3e4;
  --ink:#1c1a3a; --muted:#66637e; --faint:#9e9bb3;
  --side:#24215a; --side2:#312d72; --side-ink:#efeefb; --side-muted:#a5a1d6;
  --accent:#ff6b5a; --accent-ink:#24215a; --accent-deep:#d4402f; --accent-soft:#ffe8e4;
  --tim:#3f6fb0; --laura:#c4487a; --sienna:#7b55c7; --erika:#2f9a5a; --archer:#d9771f; --kris:#0e8f9a; --neville:#5b6b86; --maria:#9a6b2f;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --tab:66px; --top:60px; --r:16px;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent-deep);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.app{min-height:100vh;display:grid;grid-template-columns:1fr}
aside{display:none}
@media (min-width:900px){
  .app{grid-template-columns:250px 1fr}
  aside{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;background:var(--side);color:var(--side-ink);padding:22px 12px 16px;overflow:auto}
  nav.tabs{display:none!important}
}
.fam{display:flex;align-items:center;gap:12px;padding:0 10px 18px;border-bottom:1px solid var(--side2);margin-bottom:12px}
.fam .mark{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.fam .mark svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.fam b{display:block;font-size:1.05rem;font-weight:800}
.fam small{color:var(--side-muted);font-size:.82rem}
.side-nav{display:grid;gap:2px}
.side-nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--side-ink);font-weight:600;text-align:left;position:relative}
.side-nav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.side-nav button:hover{background:var(--side2)}
.side-nav button[aria-current="true"]{background:var(--side2);color:var(--accent)}
.side-nav button[aria-current="true"]::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--accent)}
.side-nav .count{margin-left:auto;background:var(--accent);color:var(--accent-ink);font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 8px}
.side-me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--side2);text-align:left;color:var(--side-ink)}
.side-me small{display:block;color:var(--side-muted);font-size:.78rem}
.side-me b{font-weight:700}

.top{position:sticky;top:0;z-index:8;background:var(--surface);border-bottom:3px solid var(--accent);padding-top:env(safe-area-inset-top,0px)}
.topin{height:var(--top);display:flex;align-items:center;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topin .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem;flex:1;min-width:0}
.topin .brand .mark{width:34px;height:34px;border-radius:10px;background:var(--side);color:var(--accent);display:grid;place-items:center;flex:none}
.topin .brand .mark svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.topin .when{flex:1;color:var(--muted);font-weight:600;display:none}
@media (min-width:900px){.topin .brand{display:none}.topin .when{display:block}}
.qa{display:none;gap:8px}
@media (min-width:900px){.qa{display:flex}.qa-phone{display:none!important}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;min-height:42px;padding:0 16px;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line2)}
.btn.dark{background:var(--side);color:var(--side-ink)}
.btn.big{min-height:50px;padding:0 22px;font-size:1rem}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.9rem;flex:none}
.av.lg{width:40px;height:40px;font-size:1rem}
.me-phone{display:flex}
@media (min-width:900px){.me-phone{display:none}}

main{padding:24px max(16px,env(safe-area-inset-right,0px)) calc(var(--tab) + 36px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:1100px;width:100%;display:grid;gap:20px;align-content:start}
@media (min-width:900px){main{padding:30px 34px 48px}}
main>*{min-width:0}

/* ---------- page heads ---------- */
.hello h1{margin:0;font-size:clamp(1.75rem,6vw,2.4rem);font-weight:800;letter-spacing:-.02em;line-height:1.1}
.hello p{margin:6px 0 0;color:var(--muted);font-size:1.02rem}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph h1{margin:0;font-size:1.8rem;font-weight:800;letter-spacing:-.02em}
.ph p{margin:4px 0 0;color:var(--muted)}

/* ---------- cards ---------- */
.grid{display:grid;gap:16px}
@media (min-width:760px){.grid.home{grid-template-columns:1.35fr 1fr}.grid.home .span{grid-row:span 2}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ch{display:flex;align-items:center;gap:10px;padding:16px 18px 12px}
.ch h2{margin:0;font-size:1.08rem;font-weight:800;flex:1}
.ch .ico{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent-deep);display:grid;place-items:center;flex:none}
.ch .ico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.more{color:var(--accent-deep);font-weight:700;font-size:.9rem;padding:6px 2px}
.cb{padding:0 18px 18px}
.empty{color:var(--muted);padding:6px 0 4px}
.empty b{display:block;color:var(--ink);font-weight:700;margin-bottom:2px}

/* event rows */
.ev{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:12px 18px;border-top:1px solid var(--line);width:100%;text-align:left;align-items:start}
.ev:hover{background:var(--sunk)}
.ev .tm{font-weight:800;font-variant-numeric:tabular-nums;font-size:.95rem;line-height:1.3}
.ev .tm small{display:block;font-weight:500;color:var(--faint);font-size:.8rem}
.ev .tt{font-weight:700;overflow-wrap:anywhere}
.ev .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;color:var(--muted);font-size:.85rem;margin-top:3px}
.ev.past{opacity:.5}
.who{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.pip{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.type{font-size:.75rem;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.type.work{background:#fff4e2;color:#9a5a00;border-color:#f6dfb5}
.type.sport{background:#e6f0ff;color:#2d5ca8;border-color:#cfe0fb}
.type.school{background:#f1ebff;color:#6142b0;border-color:#e0d5fb}
.type.appointment{background:var(--accent-soft);color:var(--accent-deep);border-color:#ffcdc5}

/* dinner card */
.dinner{padding:4px 18px 18px;display:grid;gap:10px}
.dinner .dish{font-size:1.45rem;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.dinner .dish.none{font-size:1.05rem;color:var(--muted);font-weight:600}
.dinner .meta{color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* shopping glance */
.stat{display:flex;align-items:baseline;gap:8px;padding:0 18px 8px}
.stat b{font-size:2.2rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted)}
.mini{list-style:none;margin:0;padding:0 18px 6px}
.mini li{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-weight:600}
.mini li small{margin-left:auto;color:var(--faint);font-weight:500}
.quick{display:flex;gap:8px;padding:10px 18px 18px}
.quick input{flex:1;min-width:0;border:1px solid var(--line2);background:var(--sunk);border-radius:12px;padding:0 14px;min-height:46px;font-size:16px}
.quick input:focus{outline:none;border-color:var(--accent-deep);background:var(--surface)}

/* list rows (shopping, chores) */
.row{display:flex;align-items:center;gap:14px;min-height:62px;padding:10px 10px 10px 18px;border-top:1px solid var(--line);width:100%;text-align:left}
.row:first-child{border-top:0}
.row .txt{flex:1;min-width:0}
.row .txt b{display:block;font-weight:600;font-size:1.02rem;overflow-wrap:anywhere}
.row .txt small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.83rem;margin-top:1px}
.check{width:28px;height:28px;border-radius:9px;border:2px solid var(--line2);flex:none;display:grid;place-items:center;background:var(--surface)}
.check svg{width:15px;height:15px;stroke:var(--accent-ink);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.row.done .check{background:var(--accent);border-color:var(--accent)}
.row.done .check svg{opacity:1}
.row.done .txt b{color:var(--faint);text-decoration:line-through}
.icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--faint);flex:none}
.icon:hover{background:var(--sunk);color:var(--ink)}
.icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.glabel{display:flex;align-items:center;gap:8px;padding:12px 18px 8px;font-weight:800;font-size:.95rem;background:var(--sunk);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.glabel:first-child{border-top:0}
.glabel span{color:var(--faint);font-weight:600}
.glabel + .row{border-top:0}

/* composer */
.composer{display:grid;gap:10px;padding:14px;min-width:0}
.composer>*{min-width:0}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0;border:1px solid var(--line2);background:var(--sunk);border-radius:12px;padding:0 14px;min-height:48px;font-size:16px}
.inline input:focus{outline:none;border-color:var(--accent-deep);background:var(--surface)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--surface);color:var(--muted);border-radius:999px;padding:8px 14px;font-size:.9rem;font-weight:600;white-space:nowrap;min-height:40px}
.chip[aria-pressed="true"]{background:var(--side);border-color:var(--side);color:#fff}
.chip .pip{width:10px;height:10px}

/* week (calendar + dinners) */
.wk{display:flex;align-items:center;gap:8px}
.wk span{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;min-width:8.5rem;text-align:center}
.round{width:42px;height:42px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);display:grid;place-items:center}
.round svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dayblock .dh{display:flex;align-items:baseline;gap:10px;padding:14px 18px 10px;background:var(--sunk);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.dayblock:first-child .dh{border-top:0}
.dayblock .dh b{font-weight:800}
.dayblock .dh span{color:var(--muted);font-size:.9rem}
.dayblock .dh em{margin-left:auto;font-style:normal;font-size:.78rem;font-weight:800;color:var(--accent-deep);background:var(--accent-soft);border-radius:999px;padding:2px 10px}
.dayblock .dh + .ev{border-top:0}
.dayblock .none{padding:12px 18px;color:var(--faint);font-size:.92rem}
.night{display:grid;grid-template-columns:70px 1fr auto;align-items:center;gap:4px 14px;min-height:70px;padding:12px 14px 12px 18px;border-top:1px solid var(--line);width:100%;text-align:left}
.night:first-child{border-top:0}
.night:hover{background:var(--sunk)}
.night .dn b{display:block;font-weight:800;font-size:1.05rem}
.night .dn small{color:var(--faint);font-size:.82rem}
.night .dish{font-weight:700;font-size:1.05rem}
.night .dish.none{color:var(--faint);font-weight:500}
.night .dmeta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.84rem;margin-top:2px}
.night.tonight{background:var(--accent-soft)}
.tag{font-size:.75rem;font-weight:800;color:var(--accent-deep);background:var(--surface);border:1px solid #ffcdc5;border-radius:999px;padding:3px 10px}

/* chores */
.kidh{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.kidh b{font-weight:800;font-size:1.1rem;flex:1}
.meter{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.88rem;font-weight:600;font-variant-numeric:tabular-nums}
.meter i{display:block;width:70px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i span{display:block;height:100%}
.emptyrow{padding:16px 18px;color:var(--faint)}
.kids{display:grid;gap:16px}
@media (min-width:1000px){.kids{grid-template-columns:repeat(3,1fr);align-items:start}}


/* ---------- Today: sky + timeline ---------- */
.sky{position:relative;overflow:hidden;color:#fff;border-radius:24px;padding:30px 24px 30px;min-height:190px;display:flex;flex-direction:column;justify-content:flex-end}
.sky .sd{margin:0;font-weight:700;opacity:.85;font-size:.9rem;position:relative}
.sky h1{margin:4px 0 0;font-size:clamp(1.9rem,7vw,2.6rem);font-weight:800;line-height:1.08;letter-spacing:-.02em;max-width:15ch;position:relative;text-wrap:balance}
.sky .faces{display:flex;margin-top:16px;position:relative}
.sky .faces .av{border:2px solid rgba(255,255,255,.9);margin-right:-6px;width:32px;height:32px;font-size:.82rem}
.sky .faces .av.me{box-shadow:0 0 0 3px rgba(255,255,255,.45)}
.orb{position:absolute;border-radius:50%}
.orb.sun-low{right:30px;bottom:-34px;width:104px;height:104px;background:#ffc9a6;box-shadow:0 0 60px 24px rgba(255,170,130,.5)}
.orb.sun-high{right:34px;top:30px;width:64px;height:64px;background:#fff4c8;box-shadow:0 0 50px 18px rgba(255,240,180,.55)}
.orb.moon{right:40px;top:34px;width:52px;height:52px;background:#f4efdc;box-shadow:0 0 36px 8px rgba(244,239,220,.25)}
.orb.moon::after{content:"";position:absolute;width:48px;height:48px;border-radius:50%;left:-14px;top:-8px;background:#1d1a4a}
.stars{position:absolute;inset:0;background-image:radial-gradient(1.4px 1.4px at 12% 22%,#fff 50%,transparent),radial-gradient(1px 1px at 30% 12%,#fff 50%,transparent),radial-gradient(1.2px 1.2px at 52% 30%,#fff 50%,transparent),radial-gradient(1px 1px at 68% 14%,#fff 50%,transparent),radial-gradient(1.3px 1.3px at 22% 48%,#fff 50%,transparent),radial-gradient(1px 1px at 60% 52%,#fff 50%,transparent);opacity:.8}
.sky.sky-day .sd,.sky.sky-day h1{text-shadow:0 1px 12px rgba(30,60,140,.35)}
.homegrid{display:grid;gap:16px;margin-top:-6px}
.homegrid .side{display:grid;gap:12px;align-content:start}
@media (min-width:900px){.homegrid{grid-template-columns:1fr 320px;align-items:start;margin-top:0}.homegrid .side{order:2;position:sticky;top:84px}}
.pin{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:20px;padding:14px 16px;text-align:left;width:100%;box-shadow:0 12px 26px -18px rgba(36,33,90,.55);border:1px solid var(--line)}
.pin .pc{width:46px;height:46px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:1.15rem;flex:none}
.pin .pt{min-width:0}
.pin .pt b{display:block;font-weight:800}
.pin .pt span{display:block;font-size:.86rem;color:var(--muted);line-height:1.45;overflow-wrap:anywhere}
.pin.tmw{background:var(--side);color:#fff;border-color:var(--side)}
.pin.tmw .pt span{color:var(--side-muted)}
.tl h2{margin:0 0 12px;font-size:1.2rem;font-weight:800}
.allday{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.adchip{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.9rem}
.adchip small{color:var(--muted);font-weight:500}
.slot{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:start}
.slot .tm{font-size:.82rem;font-weight:700;color:var(--muted);padding-top:14px;text-align:right;font-variant-numeric:tabular-nums}
.blk{display:grid;gap:2px;border-radius:18px;padding:12px 16px;margin:5px 0;color:#fff;text-align:left;width:100%;box-shadow:0 8px 18px -14px rgba(36,33,90,.7)}
.blk b{font-weight:800;font-size:1rem}
.blk b em{font-style:normal;font-weight:600;opacity:.85;font-size:.85rem}
.blk span{font-size:.84rem;opacity:.92}
.dinnerblk{background:var(--side)}
.slot.past .blk{opacity:.5;box-shadow:none}
.slot.past .tm{color:var(--faint)}
.nowslot .tm{color:var(--accent-deep);padding-top:6px}
.nowline{height:2px;background:var(--accent);margin-top:14px;position:relative;border-radius:1px}
.nowline::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.tlempty{margin:0 0 4px;color:var(--muted);background:var(--surface);border:1px dashed var(--line2);border-radius:18px;padding:18px}
.tlacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
@media (max-width:899px){
  body[data-tab="home"] .top{position:absolute;left:0;right:0;background:transparent;border-bottom:0;color:#fff}
  body[data-tab="home"] .topin .brand .mark{background:rgba(255,255,255,.18);color:#fff}
  body[data-tab="home"] main{padding-top:0}
  body[data-tab="home"] .sky{margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));border-radius:0 0 28px 28px;padding:calc(var(--top) + env(safe-area-inset-top,0px) + 34px) 22px 34px;min-height:300px}
  body[data-tab="home"] .orb.sun-high,body[data-tab="home"] .orb.moon{top:calc(var(--top) + env(safe-area-inset-top,0px) + 22px)}
  .homegrid .side{margin-top:-34px;position:relative;z-index:1;padding:0 4px}
}

/* bottom tabs (phone) */

@media (min-width:900px){#toast{bottom:28px}}

<script>
/* ---------- family ---------- */
const FAMILY=[{id:'tim',name:'Tim',kid:false,user:true},{id:'laura',name:'Laura',kid:false,user:true},{id:'sienna',name:'Sienna',kid:true,user:true},{id:'erika',name:'Erika',kid:true,user:true},{id:'archer',name:'Archer',kid:true,user:true},
  {id:'kris',name:'Kris',kid:false,user:true},{id:'neville',name:'Neville',kid:false,user:false},{id:'maria',name:'Maria',kid:false,user:false}];
const USERS=FAMILY.filter(p=>p.user);
const KIDS=FAMILY.filter(p=>p.kid);
const person=id=>FAMILY.find(p=>p.id===id)||{id:'',name:'Someone'};
const colour=id=>person(id).id?`var(--${id})`:'var(--faint)';
const AISLES=['Fruit & veg','Meat & fish','Dairy & eggs','Bakery','Pantry','Frozen','Drinks','Household','Other'];
const TYPES=[['appointment','Appointment'],['work','Work'],['sport','Sport'],['school','School'],['social','Social'],['other','Other']];
const typeName=t=>(TYPES.find(x=>x[0]===t)||TYPES[5])[1];

/* ---------- icons ---------- */
const I={
 home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
 cal:'<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
 shop:'<path d="M5 7h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 7a3 3 0 0 1 6 0"/>',
 meal:'<circle cx="12" cy="13" r="6"/><path d="M3 4v6M21 4v16M19 4c0 3 2 5 2 5"/>',
 chore:'<path d="M8 12.5l2.5 2.5L16 9.5"/><rect x="3.5" y="3.5" width="17" height="17" rx="5"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 x:'<path d="M7 7l10 10M17 7L7 17"/>',
 pen:'<path d="M5 19l1-4L16 5l3 3L9 18z"/>',
 left:'<path d="M15 6l-6 6 6 6"/>', right:'<path d="M9 6l6 6-6 6"/>',
 check:'<path d="M6 12.5l4 4L18 8"/>'
};
const svg=(k,extra='')=>`<svg viewBox="0 0 24 24"${extra}>${I[k]}</svg>`;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromYmd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ymd(new Date());
const monday=d=>{const x=new Date(d);const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);x.setHours(0,0,0,0);return x};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOWL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const nice=d=>d.getDate()+' '+MON[d.getMonth()];
const nowIso=()=>new Date().toISOString();
const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const t12=s=>{if(!s)return'';const [h,m]=s.split(':').map(Number);return (h%12||12)+(m?':'+pad(m):'')+(h<12?'am':'pm')};
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2200)}
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const tapRows=(sel,fn)=>document.querySelectorAll(sel).forEach(b=>{b.onclick=fn;b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn.call(b,e)}}});
const isParent=()=>S.me==='tim'||S.me==='laura';

/* ---------- state ---------- */
const S={me:store.get('fh-me')||'',tab:store.get('fh-tab2')||'home',aisle:store.get('fh-aisle')||'Other',calWho:'',
  shop:{},meals:{},chores:{},log:{},events:{},week:monday(new Date()),calWeek:monday(new Date()),ready:false,db:null};
const PAGES=[['home','Today','home'],['cal','Calendar','cal'],['shop','Shopping','shop'],['meals','Dinners','meal'],['chores','Chores','chore']];
function paintNav(){
  const open=Object.values(S.shop).filter(i=>!i.done).length;
  $('#sideNav').innerHTML=PAGES.map(([k,n,ic])=>`<button data-tab="${k}" aria-current="${S.tab===k}">${svg(ic)}${n}${k==='shop'&&open?`<span class="count">${open}</span>`:''}</button>`).join('');
  $('#tabs').innerHTML=PAGES.map(([k,n,ic])=>`<button data-tab="${k}" aria-current="${S.tab===k}">${svg(ic)}<span>${n}</span>${k==='shop'&&open?`<span class="badge">${open}</span>`:''}</button>`).join('');
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
}
function setTab(t){S.tab=t;store.set('fh-tab2',t);render();scrollTo(0,0)}

/* ---------- quick add ---------- */
const ADDS=[['appt','Appointment','cal','For anyone in the family'],['shop','Shopping','shop','Add to the list'],['dinner','Dinner','meal','Plan a night'],['chore','Chore','chore','A job for the kids']];
function adds(){return ADDS.filter(a=>a[0]!=='chore'||isParent())}
function paintTop(){
  const d=new Date();$('#topWhen').textContent=DOWL[d.getDay()]+' '+d.getDate()+' '+MONL[d.getMonth()];
  $('#qaDesk').innerHTML=adds().map(a=>`<button class="btn${a[0]==='appt'?'':' ghost'}" data-add="${a[0]}">${svg('plus')}${a[1]}</button>`).join('');
  document.querySelectorAll('#qaDesk [data-add]').forEach(b=>b.onclick=()=>doAdd(b.dataset.add));
  const p=person(S.me);
  for(const [av,nm] of [['#sideAv','#sideName'],['#phoneAv',null]]){const a=$(av);a.textContent=p.id?p.name[0]:'?';a.style.background=p.id?colour(p.id):'var(--faint)';if(nm)$(nm).textContent=p.id?p.name:'Choose who you are'}
}
$('#qaPhone').onclick=()=>{openSheet(`<h2>Add</h2><div class="addmenu">${adds().map(a=>`<button data-add="${a[0]}"><span class="ico">${svg(a[2])}</span>${a[1]}<small>${a[3]}</small></button>`).join('')}</div>`);
  document.querySelectorAll('#panel [data-add]').forEach(b=>b.onclick=()=>doAdd(b.dataset.add))};
function doAdd(k){if(needMe())return;if(k==='appt')editEvent(null);else if(k==='dinner')editMeal(nextFreeNight());else if(k==='chore')editChore(null);else addShopSheet()}
function nextFreeNight(){for(let i=0;i<14;i++){const k=ymd(addDays(new Date(),i));if(!(S.meals[k]||{}).dinner)return k}return today()}

/* ---------- who's using this device ---------- */
function pickMe(){
  openSheet(`<h2>Who's using this device?</h2><p class="sub">Whatever you add or tick shows your name and colour.</p>
  <div class="people">${USERS.map(p=>`<button class="person" data-me="${p.id}" aria-pressed="${S.me===p.id}"><span class="av" style="background:${colour(p.id)}">${p.name[0]}</span>${p.name}</button>`).join('')}</div>`);
  document.querySelectorAll('[data-me]').forEach(b=>b.onclick=()=>{S.me=b.dataset.me;store.set('fh-me',S.me);closeSheet();render()});
}
$('#sideMe').onclick=pickMe;$('#mePhone').onclick=pickMe;
function needMe(){if(!S.me){pickMe();return true}return false}

/* ---------- sheet ---------- */
function openSheet(html){$('#panel').innerHTML=html;$('#sheet').hidden=false;const f=$('#panel input[type=text],#panel input:not([type]),#panel textarea');if(f&&matchMedia('(min-width:700px)').matches)setTimeout(()=>f.focus(),60)}
function closeSheet(){$('#sheet').hidden=true}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* ---------- data ---------- */
async function write(fn){if(!S.db){toast('Not connected yet. Try again in a moment.');return false}try{await fn(S.db);return true}catch(e){toast("That didn't save. Check your connection and try again.");return false}}
(async()=>{
  let db=null;try{db=window.claude&&await window.claude.use('db')}catch(e){db=null}
  if(!db){S.ready=true;S.offline=true;render();return}
  S.db=db;
  const sub=(name,key)=>db.collection(name).onSnapshot(s=>{const o={};s.docs.forEach(d=>{if(d.exists)o[d.id]=d.data()});S[key]=o;S.ready=true;render()},()=>{});
  sub('events','events');sub('shopping','shop');sub('meals','meals');sub('chores','chores');sub('chorelog','log');
})();

/* ---------- render ---------- */
function render(){
  document.body.dataset.tab=S.ready&&!S.offline?S.tab:'';paintNav();paintTop();
  const v=$('#view');
  const ae=document.activeElement,keep=ae&&(ae.id==='shopText'||ae.id==='quickShop')?{id:ae.id,v:ae.value}:null;
  if(!S.ready){v.innerHTML='<div class="empty">Opening the family hub…</div>';return}
  if(S.offline){v.innerHTML='<div class="card cb" style="padding:18px"><div class="empty"><b>Not connected</b>The family hub needs its shared storage to work here.</div></div>';return}
  ({home:renderHome,cal:renderCal,shop:renderShop,meals:renderMeals,chores:renderChores}[S.tab]||renderHome)(v);
  if(keep){const i=document.getElementById(keep.id);if(i){i.value=keep.v;i.focus()}}
}

/* ===== events ===== */
const evList=()=>Object.entries(S.events).map(([id,e])=>Object.assign({id},e));
const evOn=k=>evList().filter(e=>e.date===k).sort((a,b)=>(a.allDay?'':a.start||'99').localeCompare(b.allDay?'':b.start||'99'));
function evRow(e,k){
  const now=new Date(),past=k===today()&&!e.allDay&&(e.end||e.start)&&(e.end||e.start)<pad(now.getHours())+':'+pad(now.getMinutes());
  const who=(e.who||[]).map(id=>`<span class="who"><span class="pip" style="background:${colour(id)}"></span>${esc(person(id).name)}</span>`).join('');
  return `<button class="ev${past?' past':''}" data-ev="${esc(e.id)}"><span class="tm">${e.allDay||!e.start?'All day':t12(e.start)}${!e.allDay&&e.end?`<small>to ${t12(e.end)}</small>`:''}</span>
   <span><span class="tt">${esc(e.title)}</span><span class="meta">${who}${e.type&&e.type!=='other'?`<span class="type ${esc(e.type)}">${typeName(e.type)}</span>`:''}${e.where?`<span>${esc(e.where)}</span>`:''}</span></span></button>`;
}
function bindEv(){document.querySelectorAll('[data-ev]').forEach(b=>b.onclick=()=>editEvent(b.dataset.ev))}
function editEvent(id,dateDefault){
  if(needMe())return;
  const e=id?S.events[id]:{title:'',date:dateDefault||today(),start:'',end:'',allDay:false,who:S.me?[S.me]:[],type:'appointment',where:'',notes:''};
  const who=new Set(e.who||[]);let type=e.type||'appointment';
  openSheet(`<h2>${id?'Edit':'New'} ${id?esc(typeName(type).toLowerCase()):'appointment'}</h2><form class="form" id="evF">
   <label class="field"><span>What</span><input id="eTitle" value="${esc(e.title)}" placeholder="e.g. Dentist, Work, Hockey training" autocomplete="off" required></label>
   <div class="field"><span>Who</span><div class="chips wrap">${FAMILY.map(p=>`<button type="button" class="chip" data-who="${p.id}" aria-pressed="${who.has(p.id)}"><span class="pip" style="background:${colour(p.id)}"></span>${p.name}</button>`).join('')}</div></div>
   <div class="field"><span>Type</span><div class="chips wrap">${TYPES.map(t=>`<button type="button" class="chip" data-type="${t[0]}" aria-pressed="${type===t[0]}">${t[1]}</button>`).join('')}</div></div>
   <label class="field"><span>Date</span><input type="date" id="eDate" value="${esc(e.date)}" required></label>
   <label class="toggle"><input type="checkbox" id="eAll"${e.allDay?' checked':''}>All day</label>
   <div class="two" id="eTimes"><label class="field"><span>Starts</span><input type="time" id="eStart" value="${esc(e.start||'')}"></label><label class="field"><span>Ends</span><input type="time" id="eEnd" value="${esc(e.end||'')}"></label></div>
   <label class="field"><span>Where (optional)</span><input id="eWhere" value="${esc(e.where||'')}" placeholder="e.g. Kangaroo Flat Dental" autocomplete="off"></label>
   <label class="field"><span>Notes (optional)</span><textarea id="eNotes">${esc(e.notes||'')}</textarea></label>
   <div class="actions">${id?'<button type="button" class="link danger" id="eDel">Delete</button>':''}<span class="grow"></span><button type="button" class="btn ghost" id="eCancel">Cancel</button><button class="btn">Save</button></div></form>`);
  document.querySelectorAll('[data-who]').forEach(b=>b.onclick=()=>{const p=b.dataset.who;who.has(p)?who.delete(p):who.add(p);b.setAttribute('aria-pressed',who.has(p))});
  document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{type=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  const times=()=>$('#eTimes').hidden=$('#eAll').checked;$('#eAll').onchange=times;times();
  $('#eCancel').onclick=closeSheet;
  $('#evF').onsubmit=async ev=>{ev.preventDefault();const t=$('#eTitle').value.trim(),d=$('#eDate').value;if(!t||!d)return;
    if(!who.size){toast('Pick who it is for');return}
    const all=$('#eAll').checked;
    const r={title:t.slice(0,100),date:d,allDay:all,start:all?'':$('#eStart').value,end:all?'':$('#eEnd').value,who:[...who],type,where:$('#eWhere').value.trim().slice(0,120),notes:$('#eNotes').value.trim().slice(0,1000),
      addedBy:id?(e.addedBy||S.me):S.me,addedAt:id?(e.addedAt||nowIso()):nowIso(),updatedBy:S.me,updatedAt:nowIso()};
    if(await write(db=>db.doc('events/'+(id||rid())).set(r))){closeSheet();toast(id?'Saved':'Added to the calendar')}};
  const del=$('#eDel');if(del)del.onclick=async()=>{if(await write(db=>db.doc('events/'+id).delete())){closeSheet();toast('Deleted')}};
}

/* ===== Today (landing): sky that follows the time of day, then the family's day on one timeline ===== */
function skyFor(h){
  if(h>=21||h<5)return{k:'night',bg:'linear-gradient(180deg,#0e0c30 0%,#24215a 60%,#3b2f7a 100%)',orb:'moon'};
  if(h<8)return{k:'dawn',bg:'linear-gradient(180deg,#3a3480 0%,#b8669c 55%,#ffb48a 100%)',orb:'sun-low'};
  if(h<17)return{k:'day',bg:'linear-gradient(180deg,#3567cf 0%,#6f9ff0 60%,#b9d4ff 100%)',orb:'sun-high'};
  return{k:'dusk',bg:'linear-gradient(180deg,#24215a 0%,#5b3a86 55%,#ff8a6a 100%)',orb:'sun-low'};
}
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
function evWho(e){return (e.who||[]).map(id=>person(id).name).join(', ').replace(/, ([^,]*)$/,' and $1')}
function renderHome(v){
  const d=new Date(),h=d.getHours(),p=person(S.me),k=today(),tk=ymd(addDays(d,1));
  const part=h<5?'Good night':h<12?'Good morning':h<17?'Good afternoon':h<21?'Good evening':'Good night';
  const sky=skyFor(h);
  const evs=evOn(k),allDay=evs.filter(e=>e.allDay||!e.start),timed=evs.filter(e=>!e.allDay&&e.start);
  const m=S.meals[k]||{};
  const items=timed.map(e=>({t:e.start,e}));
  if(m.dinner)items.push({t:m.time||'18:30',dinner:m});
  items.sort((a,b)=>a.t.localeCompare(b.t));
  const now=hm(d);let nowAt=items.findIndex(i=>i.t>now);if(nowAt<0)nowAt=items.length;
  const open=Object.values(S.shop).filter(i=>!i.done).sort((a,b)=>(b.addedAt||'').localeCompare(a.addedAt||''));
  const tev=evOn(tk),tm=S.meals[tk]||{};
  const tomorrow=tev.slice(0,3).map(e=>`${esc(evWho(e)||'Someone')}: ${esc(e.title)}${!e.allDay&&e.start?' '+t12(e.start):''}`);
  const slot=(i,idx)=>{
    const past=idx<nowAt&&!(i.e&&i.e.end&&i.e.end>now);
    if(i.dinner)return `<div class="slot${past?' past':''}"><span class="tm">${t12(i.t)}</span><button class="blk dinnerblk" id="tlDinner"><b>Dinner: ${esc(i.dinner.dinner)}</b><span>${i.dinner.cook?esc(person(i.dinner.cook).name)+' cooking':'No cook chosen yet'}</span></button></div>`;
    const e=i.e,c=(e.who||[])[0];
    return `<div class="slot${past?' past':''}"><span class="tm">${t12(e.start)}</span><button class="blk" data-ev="${esc(e.id)}" style="background:${colour(c)}"><b>${esc(e.title)}${e.end?` <em>until ${t12(e.end)}</em>`:''}</b><span>${esc(evWho(e))}${e.where?', '+esc(e.where):''}</span></button></div>`};
  const nowLine=`<div class="slot nowslot"><span class="tm">Now</span><div class="nowline"></div></div>`;
  let tl='';items.forEach((i,idx)=>{if(idx===nowAt)tl+=nowLine;tl+=slot(i,idx)});if(nowAt===items.length&&items.length)tl+=nowLine;
  v.innerHTML=`<section class="sky sky-${sky.k}" style="background:${sky.bg}"><span class="orb ${sky.orb}"></span>${sky.k==='night'?'<span class="stars"></span>':''}
      <p class="sd">${DOWL[d.getDay()]} ${d.getDate()} ${MONL[d.getMonth()]}</p><h1>${part}${p.id?', '+esc(p.name):''}.</h1>
      <div class="faces">${USERS.map(f=>`<span class="av${f.id===S.me?' me':''}" style="background:${colour(f.id)}" title="${f.name}">${f.name[0]}</span>`).join('')}</div></section>
  <div class="homegrid">
    <div class="side">
      <button class="pin" id="toShop"><span class="pc">${open.length}</span><span class="pt"><b>Shopping list</b><span>${open.length?esc(open.slice(0,3).map(i=>i.text).join(', '))+(open.length>3?' and '+(open.length-3)+' more':''):'Nothing to buy right now'}</span></span></button>
      <button class="pin tmw" id="toCal"><span class="pt"><b>Tomorrow</b><span>${tomorrow.length?tomorrow.join('<br>')+(tev.length>3?'<br>and '+(tev.length-3)+' more':''):'Nothing on yet'}${tm.dinner?`<br>Dinner: ${esc(tm.dinner)}`:''}</span></span></button>
    </div>
    <section class="tl"><h2>Today</h2>
      ${allDay.length?`<div class="allday">${allDay.map(e=>`<button class="adchip" data-ev="${esc(e.id)}"><span class="pip" style="background:${colour((e.who||[])[0])}"></span>${esc(e.title)}<small>${esc(evWho(e))}</small></button>`).join('')}</div>`:''}
      ${items.length?tl:`<p class="tlempty">${allDay.length?'Nothing else on today.':'Nothing on today.'} Add appointments, work shifts and sport so everyone knows who's where.</p>`}
      <div class="tlacts"><button class="btn ghost" id="homeAddEv">${svg('plus')}Add to today</button>${m.dinner?'':`<button class="btn ghost" id="planTonight">${svg('plus')}Plan dinner</button>`}</div>
    </section>
  </div>`;
  bindEv();
  $('#toCal').onclick=()=>{S.calWeek=monday(addDays(new Date(),1));setTab('cal')};$('#toShop').onclick=()=>setTab('shop');
  $('#homeAddEv').onclick=()=>editEvent(null,k);
  const pt=$('#planTonight');if(pt)pt.onclick=()=>editMeal(k);
  const td=$('#tlDinner');if(td)td.onclick=()=>editMeal(k);
}

/* ===== Calendar ===== */
function renderCal(v){
  const days=[...Array(7)].map((_,i)=>addDays(S.calWeek,i));const t=today();
  const filt=e=>!S.calWho||(e.who||[]).includes(S.calWho);
  v.innerHTML=`<div class="ph"><div><h1>Calendar</h1><p>${nice(days[0])} to ${nice(days[6])}</p></div>
    <div class="wk"><button class="round" id="cPrev" aria-label="Previous week">${svg('left')}</button><button class="btn ghost" id="cToday">This week</button><button class="round" id="cNext" aria-label="Next week">${svg('right')}</button></div></div>
  <div class="chips" role="group" aria-label="Show"><button class="chip" data-cw="" aria-pressed="${!S.calWho}">Everyone</button>${FAMILY.map(p=>`<button class="chip" data-cw="${p.id}" aria-pressed="${S.calWho===p.id}"><span class="pip" style="background:${colour(p.id)}"></span>${p.name}</button>`).join('')}</div>
  <section class="card">${days.map(d=>{const k=ymd(d),evs=evOn(k).filter(filt);
    return `<div class="dayblock"><div class="dh"><b>${DOWL[d.getDay()]}</b><span>${nice(d)}</span>${k===t?'<em>Today</em>':''}</div>${evs.length?evs.map(e=>evRow(e,k)).join(''):`<button class="none" data-addon="${k}" style="width:100%;text-align:left">Nothing on. Tap to add.</button>`}</div>`}).join('')}</section>`;
  bindEv();
  document.querySelectorAll('[data-addon]').forEach(b=>b.onclick=()=>editEvent(null,b.dataset.addon));
  document.querySelectorAll('[data-cw]').forEach(b=>b.onclick=()=>{S.calWho=b.dataset.cw;render()});
  $('#cPrev').onclick=()=>{S.calWeek=addDays(S.calWeek,-7);render()};$('#cNext').onclick=()=>{S.calWeek=addDays(S.calWeek,7);render()};$('#cToday').onclick=()=>{S.calWeek=monday(new Date());render()};
}

/* ===== Shopping ===== */
async function addShop(t,aisle){return write(db=>db.collection('shopping').doc(rid()).set({text:t.slice(0,120),aisle,addedBy:S.me,addedAt:nowIso(),done:false,doneBy:'',doneAt:''}))}
function aisleChips(){return `<div class="chips" role="group" aria-label="Aisle">${AISLES.map(a=>`<button type="button" class="chip" data-aisle="${esc(a)}" aria-pressed="${a===S.aisle}">${esc(a)}</button>`).join('')}</div>`}
function bindAisles(scope){scope.querySelectorAll('[data-aisle]').forEach(b=>b.onclick=()=>{S.aisle=b.dataset.aisle;store.set('fh-aisle',S.aisle);scope.querySelectorAll('[data-aisle]').forEach(c=>c.setAttribute('aria-pressed',c===b))})}
function addShopSheet(){
  openSheet(`<h2>Add to shopping</h2><form class="form" id="shF"><label class="field"><span>Item</span><input id="shT" placeholder="e.g. 2L milk" autocomplete="off" required></label><div class="field"><span>Aisle</span>${aisleChips()}</div>
   <div class="actions"><span class="grow"></span><button type="button" class="btn ghost" id="shC">Done</button><button class="btn">Add</button></div></form>`);
  bindAisles($('#panel'));$('#shC').onclick=closeSheet;
  $('#shF').onsubmit=async e=>{e.preventDefault();const t=$('#shT').value.trim();if(!t)return;$('#shT').value='';if(await addShop(t,S.aisle))toast('Added '+t)};
}
function renderShop(v){
  const items=Object.entries(S.shop).map(([id,d])=>Object.assign({id},d));
  const open=items.filter(i=>!i.done),bought=items.filter(i=>i.done).sort((a,b)=>(b.doneAt||'').localeCompare(a.doneAt||''));
  const groups=AISLES.map(a=>({a,list:open.filter(i=>(i.aisle||'Other')===a).sort((x,y)=>(x.addedAt||'').localeCompare(y.addedAt||''))})).filter(g=>g.list.length);
  v.innerHTML=`<div class="ph"><div><h1>Shopping</h1><p>${open.length?open.length+' thing'+(open.length===1?'':'s')+' to buy':'Nothing to buy right now'}</p></div>${bought.length?'<button class="btn ghost" id="clearBought">Clear bought</button>':''}</div>
  <section class="card"><form class="composer" id="addShop"><div class="inline"><input id="shopText" placeholder="Add something, e.g. 2L milk" autocomplete="off" enterkeyhint="done" aria-label="Item"><button class="btn big">Add</button></div>${aisleChips()}</form></section>
  ${groups.length?`<section class="card">${groups.map(g=>`<div class="glabel">${esc(g.a)}<span>${g.list.length}</span></div>${g.list.map(itemRow).join('')}`).join('')}</section>`:
   `<section class="card"><div class="cb" style="padding-top:18px"><div class="empty"><b>All bought</b>Add something above. It shows on everyone's phone within a minute.</div></div></section>`}
  ${bought.length?`<section class="card"><div class="glabel">Bought<span>${bought.length}</span></div>${bought.slice(0,30).map(itemRow).join('')}</section>`:''}`;
  bindAisles(v);
  $('#addShop').onsubmit=async e=>{e.preventDefault();if(needMe())return;const t=$('#shopText').value.trim();if(!t)return;$('#shopText').value='';await addShop(t,S.aisle)};
  tapRows('[data-shop]',function(e){if(e.target.closest('.icon'))return;if(needMe())return;const id=this.dataset.shop,i=S.shop[id];
    write(db=>db.doc('shopping/'+id).set(Object.assign({},i,i.done?{done:false,doneBy:'',doneAt:''}:{done:true,doneBy:S.me,doneAt:nowIso()})))});
  v.querySelectorAll('.icon[data-del]').forEach(b=>b.onclick=()=>write(db=>db.doc('shopping/'+b.dataset.del).delete()));
  const cb=$('#clearBought');if(cb)cb.onclick=async()=>{for(const i of bought)await write(db=>db.doc('shopping/'+i.id).delete());toast('Cleared '+bought.length+' bought item'+(bought.length===1?'':'s'))};
}
function itemRow(i){
  const by=i.done?i.doneBy:i.addedBy,p=person(by);
  return `<div class="row${i.done?' done':''}" data-shop="${esc(i.id)}" role="button" tabindex="0" aria-pressed="${!!i.done}"><span class="check">${svg('check')}</span>
   <span class="txt"><b>${esc(i.text)}</b><small><span class="pip" style="background:${colour(by)}"></span>${i.done?'Bought by ':'Added by '}${esc(p.name)}</small></span>
   <button class="icon" data-del="${esc(i.id)}" aria-label="Remove ${esc(i.text)}">${svg('x')}</button></div>`;
}

/* ===== Dinners ===== */
function renderMeals(v){
  const days=[...Array(7)].map((_,k)=>addDays(S.week,k));const t=today();
  const planned=days.filter(d=>(S.meals[ymd(d)]||{}).dinner).length;
  v.innerHTML=`<div class="ph"><div><h1>Dinners</h1><p>${nice(days[0])} to ${nice(days[6])}. ${planned} of 7 nights planned</p></div>
    <div class="wk"><button class="round" id="wkPrev" aria-label="Previous week">${svg('left')}</button><button class="btn ghost" id="wkNow">This week</button><button class="round" id="wkNext" aria-label="Next week">${svg('right')}</button></div></div>
  <section class="card">${days.map(d=>{const k=ymd(d),m=S.meals[k]||{};const ing=(m.ingredients||[]).filter(Boolean);
    return `<button class="night${k===t?' tonight':''}" data-day="${k}"><span class="dn"><b>${DOW[d.getDay()]}</b><small>${nice(d)}</small></span>
      <span><span class="dish${m.dinner?'':' none'}">${m.dinner?esc(m.dinner):'Nothing planned'}</span>
      ${m.dinner&&(m.cook||ing.length)?`<span class="dmeta">${m.cook?`<span class="pip" style="background:${colour(m.cook)}"></span>${esc(person(m.cook).name)} cooking`:''}${m.cook&&ing.length?'. ':''}${ing.length?ing.length+' ingredient'+(ing.length===1?'':'s'):''}</span>`:''}</span>
      ${k===t?'<span class="tag">Tonight</span>':`<span style="color:var(--faint)">${svg('right','  width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"')}</span>`}</button>`}).join('')}</section>`;
  $('#wkPrev').onclick=()=>{S.week=addDays(S.week,-7);render()};$('#wkNext').onclick=()=>{S.week=addDays(S.week,7);render()};$('#wkNow').onclick=()=>{S.week=monday(new Date());render()};
  v.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>editMeal(b.dataset.day));
}
function editMeal(k){
  if(needMe())return;const m=S.meals[k]||{};const d=fromYmd(k);let cook=m.cook||'';
  openSheet(`<h2>Dinner, ${DOWL[d.getDay()]} ${nice(d)}</h2><form class="form" id="mealF">
    <label class="field"><span>Dinner</span><input id="mDinner" value="${esc(m.dinner||'')}" placeholder="e.g. Lamb roast" autocomplete="off"></label>
    <label class="field"><span>Dinner time</span><input type="time" id="mTime" value="${esc(m.time||'18:30')}"></label>
    <div class="field"><span>Who's cooking</span><div class="chips wrap">${[{id:'',name:'Not decided'}].concat(USERS).map(p=>`<button type="button" class="chip" data-cook="${p.id}" aria-pressed="${cook===p.id}">${p.id?`<span class="pip" style="background:${colour(p.id)}"></span>`:''}${p.name}</button>`).join('')}</div></div>
    <label class="field"><span>Ingredients, one per line</span><textarea id="mIng" placeholder="Leg of lamb&#10;Potatoes&#10;Rosemary">${esc((m.ingredients||[]).join('\n'))}</textarea></label>
    <div class="actions"><button type="button" class="btn ghost" id="mToList">Add ingredients to shopping</button><span class="grow"></span><button class="btn">Save</button></div>
    ${m.dinner?'<button type="button" class="link danger" id="mClear" style="justify-self:start">Clear this night</button>':''}</form>`);
  document.querySelectorAll('[data-cook]').forEach(b=>b.onclick=()=>{cook=b.dataset.cook;document.querySelectorAll('[data-cook]').forEach(c=>c.setAttribute('aria-pressed',c===b))});
  const read=()=>({dinner:$('#mDinner').value.trim().slice(0,120),time:$('#mTime').value||'18:30',cook,ingredients:$('#mIng').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,40),updatedBy:S.me,updatedAt:nowIso()});
  $('#mealF').onsubmit=async e=>{e.preventDefault();const r=read();if(await write(db=>r.dinner?db.doc('meals/'+k).set(r):db.doc('meals/'+k).delete()))closeSheet()};
  const mc=$('#mClear');if(mc)mc.onclick=async()=>{if(await write(db=>db.doc('meals/'+k).delete()))closeSheet()};
  $('#mToList').onclick=async()=>{const r=read();if(!r.ingredients.length){toast('Add some ingredients first');return}
    const have=new Set(Object.values(S.shop).filter(i=>!i.done).map(i=>i.text.toLowerCase()));let n=0;
    for(const t of r.ingredients){if(have.has(t.toLowerCase()))continue;await write(db=>db.collection('shopping').doc(rid()).set({text:t.slice(0,120),aisle:'Other',addedBy:S.me,addedAt:nowIso(),done:false,doneBy:'',doneAt:'',forMeal:k}));n++}
    if(r.dinner)await write(db=>db.doc('meals/'+k).set(r));
    toast(n?'Added '+n+' to shopping':'Already on the shopping list')};
}

/* ===== Chores ===== */
const periodKey=(c,d)=>c.freq==='weekly'?'w'+ymd(monday(d)):ymd(d);
function choreDue(c,d){if(c.freq==='weekly')return true;const days=c.days&&c.days.length?c.days:[0,1,2,3,4,5,6];return days.includes(d.getDay())}
function renderChores(v){
  const d=new Date();const list=Object.entries(S.chores).map(([id,c])=>Object.assign({id},c)).filter(c=>c.active!==false);
  const par=isParent();
  v.innerHTML=`<div class="ph"><div><h1>Chores</h1><p>Daily jobs reset each morning, weekly jobs on Monday</p></div>${par?`<button class="btn" id="newChore">${svg('plus')}New chore</button>`:''}</div>
  <div class="kids">${KIDS.map(k=>{const mine=list.filter(c=>c.who===k.id&&choreDue(c,d)).sort((a,b)=>(a.freq||'').localeCompare(b.freq||'')||(a.title||'').localeCompare(b.title||''));
    const done=mine.filter(c=>S.log[c.id+'__'+periodKey(c,d)]).length;const pct=mine.length?Math.round(done/mine.length*100):0;
    return `<section class="card"><div class="kidh"><span class="av lg" style="background:${colour(k.id)}">${k.name[0]}</span><b>${k.name}</b>${mine.length?`<span class="meter">${done} of ${mine.length}<i><span style="width:${pct}%;background:${colour(k.id)}"></span></i></span>`:''}</div>
      ${mine.length?mine.map(c=>{const key=c.id+'__'+periodKey(c,d),lg=S.log[key];return `<div class="row${lg?' done':''}" data-chore="${esc(c.id)}" role="button" tabindex="0" aria-pressed="${!!lg}"><span class="check">${svg('check')}</span><span class="txt"><b>${esc(c.title)}</b><small>${lg?`<span class="pip" style="background:${colour(lg.doneBy)}"></span>Ticked by ${esc(person(lg.doneBy).name)}`:(c.freq==='weekly'?'This week':'Today')}</small></span>${par?`<button class="icon" data-editc="${esc(c.id)}" aria-label="Edit ${esc(c.title)}">${svg('pen')}</button>`:''}</div>`}).join(''):
      `<div class="emptyrow">${par?'No jobs yet. Tap New chore to add one.':'No jobs today.'}</div>`}</section>`}).join('')}</div>`;
  const nc=$('#newChore');if(nc)nc.onclick=()=>editChore(null);
  tapRows('[data-chore]',function(e){if(e.target.closest('[data-editc]'))return;if(needMe())return;const id=this.dataset.chore,c=S.chores[id];const key=id+'__'+periodKey(c,new Date());
    write(db=>S.log[key]?db.doc('chorelog/'+key).delete():db.doc('chorelog/'+key).set({chore:id,who:c.who,period:periodKey(c,new Date()),doneBy:S.me,at:nowIso()}))});
  v.querySelectorAll('[data-editc]').forEach(b=>b.onclick=()=>editChore(b.dataset.editc));
}
function editChore(id){
  if(!isParent()){toast('Only Tim and Laura can add chores');return}
  const c=id?S.chores[id]:{title:'',who:KIDS[0].id,freq:'daily',days:[]};
  let who=c.who,freq=c.freq==='weekly'?'weekly':'daily';const days=new Set(c.days&&c.days.length?c.days:[0,1,2,3,4,5,6]);
  openSheet(`<h2>${id?'Edit chore':'New chore'}</h2><form class="form" id="choreF">
    <label class="field"><span>Job</span><input id="cTitle" value="${esc(c.title)}" placeholder="e.g. Feed the chooks" autocomplete="off" required></label>
    <div class="field"><span>Whose job</span><div class="chips wrap">${KIDS.map(k=>`<button type="button" class="chip" data-who="${k.id}" aria-pressed="${who===k.id}"><span class="pip" style="background:${colour(k.id)}"></span>${k.name}</button>`).join('')}</div></div>
    <div class="field"><span>How often</span><div class="chips"><button type="button" class="chip" data-freq="daily" aria-pressed="${freq==='daily'}">Daily</button><button type="button" class="chip" data-freq="weekly" aria-pressed="${freq==='weekly'}">Once a week</button></div></div>
    <div class="field" id="cDaysWrap"><span>Which days</span><div class="chips wrap">${[1,2,3,4,5,6,0].map(n=>`<button type="button" class="chip" data-dow="${n}" aria-pressed="${days.has(n)}">${DOW[n]}</button>`).join('')}</div></div>
    <div class="actions">${id?'<button type="button" class="link danger" id="cDel">Delete chore</button>':''}<span class="grow"></span><button class="btn">Save</button></div></form>`);
  const grp=(attr,fn)=>document.querySelectorAll('['+attr+']').forEach(b=>b.onclick=()=>fn(b));
  grp('data-who',b=>{who=b.dataset.who;document.querySelectorAll('[data-who]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  const showDays=()=>$('#cDaysWrap').hidden=freq==='weekly';
  grp('data-freq',b=>{freq=b.dataset.freq;document.querySelectorAll('[data-freq]').forEach(x=>x.setAttribute('aria-pressed',x===b));showDays()});
  grp('data-dow',b=>{const n=+b.dataset.dow;days.has(n)?days.delete(n):days.add(n);b.setAttribute('aria-pressed',days.has(n))});
  showDays();
  $('#choreF').onsubmit=async e=>{e.preventDefault();const t=$('#cTitle').value.trim();if(!t)return;
    const ds=[...days].sort();
    const r={title:t.slice(0,80),who,freq,days:ds.length===7?[]:ds,active:true,updatedBy:S.me,updatedAt:nowIso()};
    if(await write(db=>db.doc('chores/'+(id||rid())).set(r)))closeSheet()};
  const del=$('#cDel');if(del)del.onclick=async()=>{if(await write(db=>db.doc('chores/'+id).delete()))closeSheet()};
}

render();
if(!S.me)setTimeout(pickMe,400);
</script>
