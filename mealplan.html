<title>Annett Meal Planner</title>

<style>
/* Annett Meal Planner. Tell it what's in the pantry and how you want to cook; Claude suggests recipes for 7,
   you drop them onto nights of the week, and the missing ingredients go to the Family Hub shopping list.
   Same look as the Family Hub (dark indigo with a coral accent) so the two apps feel like one family. Always light. */
:root{color-scheme:light;
  --bg:#f2f1f7; --surface:#fff; --sunk:#f7f6fb; --line:#e5e3ef; --line2:#d6d3e4;
  --ink:#1c1a3a; --muted:#66637e; --faint:#9e9bb3;
  --deep:#24215a; --deep2:#312d72; --deep-ink:#efeefb; --deep-muted:#a5a1d6;
  --accent:#ff6b5a; --accent-ink:#24215a; --accent-soft:#ffe8e4; --accent-deep:#d4402f;
  --good:#2f8a4f; --good-soft:#e3f2e7; --buy:#c2552d; --buy-soft:#fbe7df;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:var(--font); --r:16px;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent-deep);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.top{position:sticky;top:0;z-index:8;background:var(--deep);color:var(--deep-ink);border-bottom:3px solid var(--accent);padding-top:env(safe-area-inset-top,0px)}
.topin{max-width:860px;margin:0 auto;height:62px;display:flex;align-items:center;gap:12px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.mark{width:38px;height:38px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px}
.brand{flex:1;min-width:0}
.brand b{display:block;font-weight:800;font-size:1.08rem;line-height:1.15}
.brand small{color:var(--deep-muted);font-size:.8rem}
.me{display:flex;align-items:center;gap:8px;border-radius:999px;padding:4px 10px 4px 4px;background:var(--deep2);font-weight:600;font-size:.9rem}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.85rem;flex:none}
.segs{max-width:860px;margin:0 auto;display:none;gap:6px;padding:0 16px 12px}
.segs button{padding:9px 16px;border-radius:999px;color:var(--deep-muted);font-weight:700}
.segs button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
@media (min-width:760px){.segs{display:flex}nav.tabs{display:none!important}}

main{max-width:860px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:760px){main{padding-bottom:48px}}
h1{font-weight:800;font-size:clamp(1.6rem,6vw,2.1rem);letter-spacing:-.02em;line-height:1.1;margin:4px 0 6px}
.lede{color:var(--muted);margin:0 0 16px}
h2{font-size:1.05rem;margin:0 0 10px;font-weight:800}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.label{display:block;font-weight:700;font-size:.92rem;margin:14px 0 8px}
.label:first-child{margin-top:0}
.hint{color:var(--muted);font-size:.85rem;margin:6px 0 0}
textarea,input[type=text],input:not([type]){width:100%;border:1px solid var(--line2);border-radius:14px;background:var(--sunk);padding:12px 14px;min-height:46px}
textarea{min-height:104px;resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:0;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{color:var(--muted);display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);font-weight:600;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}
.chip .pip{width:9px;height:9px;border-radius:50%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:800;min-height:48px;padding:0 20px;white-space:nowrap}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line2);font-weight:700}
.btn.dark{background:var(--deep);color:var(--deep-ink)}
.btn.sm{min-height:38px;padding:0 14px;font-size:.9rem;border-radius:12px}
.btn.wide{width:100%}
.link{color:var(--deep2);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--buy)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}
.serves{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap}
.serves span{color:var(--muted);font-size:.9rem}

/* requests and options */
.req{margin-bottom:18px}
.reqh{display:flex;align-items:flex-start;gap:10px;margin:0 2px 10px}
.reqh .t{flex:1;min-width:0}
.reqh b{display:block;font-size:.95rem}
.reqh small{color:var(--muted);font-size:.84rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:14px;background:var(--accent-soft);color:#8a2a1c;font-weight:600;font-size:.92rem;margin-bottom:10px}
.status.err{background:var(--buy-soft);color:#7a2f15}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:sp 0.9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.opts{display:grid;gap:10px}
@media (min-width:760px){.opts{grid-template-columns:1fr 1fr}}
.opt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:8px}
.opt h3{font-weight:800;font-size:1.12rem;margin:0;line-height:1.2}
.opt p{margin:0;color:var(--muted);font-size:.9rem}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);color:var(--muted)}
.tag.m{background:var(--deep);border-color:var(--deep);color:var(--deep-ink)}
.tag.planned{background:var(--good-soft);border-color:#bfe0c8;color:var(--good)}
.counts{display:flex;gap:14px;font-size:.85rem;font-weight:700}
.counts .have{color:var(--good)}.counts .buy{color:var(--buy)}
.opt .acts{display:flex;gap:8px;margin-top:2px}
.older{margin-top:8px}
.older summary{cursor:pointer;color:var(--muted);font-weight:700;padding:8px 2px}

/* week */
.wk{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.wk b{flex:1;text-align:center;font-weight:700}
.round{width:42px;height:42px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);display:grid;place-items:center}
.night{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line);width:100%;text-align:left}
.night:first-child{border-top:0}
.night .d{width:46px;flex:none;text-align:center}
.night .d b{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.night .d span{display:block;font-size:1.35rem;font-weight:700;line-height:1.1}
.night.today .d span{color:var(--accent-deep)}
.night .w{flex:1;min-width:0}
.night .w b{display:block;font-weight:700}
.night .w small{color:var(--muted);font-size:.84rem}
.night .w .empty{color:var(--faint);font-weight:600}
.card.flush{padding:0;overflow:hidden}

/* to buy */
.aisle{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;padding:14px 16px 6px}
.item{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line);width:100%;text-align:left}
.item .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line2);display:grid;place-items:center;flex:none}
.item[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.item[aria-pressed="false"] .txt b{text-decoration:line-through;color:var(--faint)}
.item .txt{flex:1;min-width:0}
.item .txt b{font-weight:600;display:block}
.item .txt small{color:var(--muted);font-size:.8rem}
.item .q{color:var(--muted);font-size:.88rem;font-weight:600;text-align:right}
.item.sent .box{border-style:dashed}
.sendbar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));margin-top:14px}
@media (min-width:760px){.sendbar{bottom:16px}}
.note{padding:12px 16px;border-radius:14px;background:var(--good-soft);color:#1f5a33;font-weight:600;font-size:.9rem;margin-bottom:12px}
.note.wait{background:var(--accent-soft);color:#8a2a1c}

.emptybox{text-align:center;padding:26px 18px;color:var(--muted)}
.emptybox b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}

/* bottom tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:.74rem;font-weight:700;color:var(--muted);position:relative}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="true"]{color:var(--deep)}
nav.tabs button[aria-current="true"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
nav.tabs .n{position:absolute;top:4px;left:calc(50% + 8px);background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:.68rem;padding:0 6px;font-weight:800}

/* sheet */
#sheet{position:fixed;inset:0;z-index:20;background:rgba(28,26,58,.45);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
#panel{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px))}
@media (min-width:760px){#sheet{align-items:center}#panel{border-radius:22px;max-height:86vh}}
#panel h2{font-size:1.45rem;margin:0 0 6px;line-height:1.2}
#panel .sub{color:var(--muted);margin:0 0 14px}
.ings{list-style:none;padding:0;margin:0 0 14px}
.ings li{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:.95rem}
.ings li:first-child{border-top:0}
.ings .k{font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:999px;height:fit-content;flex:none}
.ings .k.h{background:var(--good-soft);color:var(--good)}
.ings .k.b{background:var(--buy-soft);color:var(--buy)}
.ings .qq{color:var(--muted);margin-left:auto;text-align:right;flex:none;max-width:45%}
ol.steps{padding-left:20px;margin:0 0 16px}
ol.steps li{margin:0 0 8px}
.pick{display:grid;gap:8px;margin:6px 0 14px}
.pick button{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line2);border-radius:14px;text-align:left}
.pick button b{width:92px;flex:none}
.pick button span{color:var(--muted);font-size:.88rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick button.on{border-color:var(--accent);background:var(--accent-soft)}
.people{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.person{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border:1px solid var(--line2);border-radius:16px;font-weight:700}
.person .av{width:44px;height:44px;font-size:1.1rem}
.actions{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--deep);color:var(--deep-ink);padding:12px 18px;border-radius:14px;font-weight:600;z-index:30;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.18)}
#toast[hidden]{display:none}
.tag.fz{background:#e3eef6;border-color:#c9dcea;color:#2b5a7a}
.fzbox{background:#eef5fa;border:1px solid #d3e3ee;border-radius:14px;padding:12px 14px;margin:0 0 14px}
.fzbox .label{display:flex;align-items:center;gap:6px;margin:0 0 6px;color:#2b5a7a}
.fzbox p{margin:4px 0;font-size:.93rem}
.thaw{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:.8rem;font-weight:700;color:#2b5a7a}
.thaw svg{width:14px;height:14px}
.night .w b svg{width:15px;height:15px;color:#2b5a7a;vertical-align:-2px}
.fz{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.fz:first-child{border-top:0}
.fz .w{flex:1;min-width:0}.fz .w b{display:block;font-weight:700}.fz .w small{color:var(--muted);font-size:.84rem}
.fz .late{color:var(--buy);font-weight:700}.fz .soon{color:var(--accent-deep);font-weight:700}
.fz .cnt{display:flex;flex-direction:column;align-items:center;gap:6px}
.fz .cnt span{font-size:.75rem;color:var(--muted);text-align:center;line-height:1.1}
.fz .cnt span b{display:block;font-size:1.4rem;color:var(--ink)}
.fz .round{width:36px;height:36px;font-size:1.2rem;font-weight:700}
#fzOwn{margin-top:4px}
/* pantry staples */
.st{display:flex;align-items:center;gap:8px;padding:9px 12px 9px 16px;border-top:1px solid var(--line)}
.aisle+.st{border-top:0}
.st .nm{flex:1;min-width:0}
.st .nm b{display:block;font-weight:600;overflow-wrap:anywhere}
.st .nm small{display:block;color:var(--buy);font-size:.78rem;font-weight:700}
.st .amt{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:var(--sunk);font-size:.85rem;font-weight:600;color:var(--ink);max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
.st .amt.none{color:var(--faint);border-style:dashed;background:var(--surface)}
.st .lowb{min-height:34px;padding:0 10px;border-radius:999px;border:1px solid var(--line2);font-size:.8rem;font-weight:700;color:var(--muted);flex:none}
.st .lowb[aria-pressed="true"]{background:var(--buy-soft);border-color:#f0c4b2;color:var(--buy)}
.st .x{width:32px;height:34px;display:grid;place-items:center;color:var(--faint);border-radius:10px;flex:none}
.staplesum{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--good-soft);color:#1f5a33;font-size:.9rem;font-weight:600;margin-top:10px}
.staplesum.none{background:var(--sunk);color:var(--muted)}
.staplesum .grow{min-width:0}
.addrow{display:grid;grid-template-columns:1fr 36%;gap:8px}
select{width:100%;border:1px solid var(--line2);border-radius:14px;background:var(--sunk);padding:0 12px;min-height:48px;min-width:0}
.chip.add{border-style:dashed;min-height:36px;padding:0 12px;font-size:.88rem}
.chip.add svg{width:14px;height:14px}
.night.sug{background:#fff8f6;align-items:flex-start}
.night.sug .w b{color:var(--ink)}
.night .sugt{display:inline-block;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-deep);margin-bottom:2px}
.night .ctx{display:block;color:#2b5a7a;font-size:.8rem;font-weight:600;margin-top:2px}
.night .prep{display:flex;align-items:flex-start;gap:6px;margin-top:6px;font-size:.8rem;font-weight:700;color:#7a4a12}
.night .prep svg{width:14px;height:14px;margin-top:2px}
.night .taken{color:var(--muted);font-weight:600}
.sugacts{display:flex;gap:8px;margin-top:10px}
.night .open{flex:1;min-width:0;text-align:left;display:block}
.draftcard{border-color:#f4c6bd;background:linear-gradient(180deg,#fff,#fff8f6)}
.draftcard .row{flex-wrap:wrap}
.prepbox{background:#fdf3e4;border:1px solid #f1dcb8;border-radius:14px;padding:12px 14px;margin:0 0 14px}
.prepbox .label{display:flex;align-items:center;gap:6px;margin:0 0 6px;color:#7a4a12}
.prepbox p{margin:4px 0;font-size:.93rem}
.qa .label{font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 8px}
</style>

<header class="top">
  <div class="topin">
    <span class="mark" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5"/></svg></span>
    <div class="brand"><b>Meal Planner</b><small>Annett family · dinners for 7</small></div>
    <button class="me" id="meBtn" aria-label="Change who's using this device"><span class="av" id="meAv">?</span><span id="meName">Who are you?</span></button>

<script>
/* ---------- basics ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromYmd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ymd(new Date());
const monday=d=>{const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);x.setHours(0,0,0,0);return x};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],DOWL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const nice=d=>d.getDate()+' '+MON[d.getMonth()];
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const nowIso=()=>new Date().toISOString();
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const andJoin=a=>a.length<2?(a[0]||''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}

/* The same instructions are used by the scheduled task that answers requests sent from the home-screen app. */
function recipePrompt(r){
  const b=Math.max(1,Math.min(3,+r.batches||1)),total=SERVES*b,fz=isFreezer(r);
  return `You are helping the Annett family in Bendigo, Victoria, Australia plan dinners. Suggest ${r.count||6} different dinner recipes.

WHAT THEY HAVE (pantry, fridge and freezer, in their words):
${r.pantry||'(nothing listed)'}

PANTRY STAPLES ALWAYS ON HAND (with how much they have, where known):
${r.staples||'(none listed)'}

HOW THEY WANT TO COOK: ${r.methods&&r.methods.length?r.methods.join(', '):'any method'}
PREFERENCES: ${r.prefs&&r.prefs.length?r.prefs.join(', '):'none'}
OTHER NOTES: ${r.notes||'none'}

RULES
- ${b>1?`BATCH COOKING: each recipe is cooked once in a big batch that makes ${total} serves (${b} family meals of ${SERVES}): ${SERVES} are eaten that night and the rest go in the freezer. ALL quantities must be for the full ${total} serves, and the steps should say how to split it.`:`Each recipe serves ${SERVES} people (the quantities must be for ${SERVES}).`}${fz?`
- FREEZER-FRIENDLY: only suggest dishes that freeze and reheat well (stews, curries, braises, bolognese, soups, pies, bakes, meatballs, marinated raw meat). Avoid things that go watery or rubbery when frozen (salad leaves, fried or crumbed food meant to be crisp, creamy sauces that split, cooked pasta in soup). Every option must include the "freezer" object.`:''}
- Build each recipe mainly around what they have. Keep the extra things to buy short and ordinary (an Australian supermarket like Coles or Woolworths).
- Assume they always have: salt, pepper, cooking oil, water. Don't list those.
- Pantry staples count as things they have: use them freely and mark them "have": true, but never need more than the amount listed (if a recipe needs more than they have, mark it "have": false so it goes on the shopping list). Anything under RUNNING LOW is "have": false if the recipe needs it.
- If cooking methods are given, every recipe must use one of them. Respect every preference (e.g. low carb means no rice, pasta, bread or potato as the base; Kid-friendly means mild, no chilli heat).
- Use Australian names and metric units (capsicum, coriander, spring onion, mince, g, kg, ml, tbsp).
- Make the options genuinely different from each other.
- Steps: short, practical, 4-8 steps, with times and temperatures (fan-forced °C).

Reply with ONLY this JSON, nothing else:
{"options":[{"title":"...","why":"one short sentence on why it suits what they asked","method":"one of: Slow cooker, Oven, BBQ, Stovetop, Air fryer","time":"e.g. 35 min or 6 hrs on low","tags":["e.g. High protein","Low carb"],"uses":["items from their list this uses"],"ingredients":[{"item":"Chicken thighs","qty":"1.5 kg","have":true,"aisle":"Meat & fish"}],"steps":["..."],"makes":${total}${fz?`,"freezer":{"portion":"how to cool, split and pack it, e.g. Cool, split into ${b>1?b-1:1} family-size containers (7 serves each), label and date","keeps":"e.g. Up to 3 months","reheat":"how to thaw and reheat, e.g. Thaw overnight in the fridge, then reheat covered in a 180°C oven for 30 min or on the stove until piping hot"}`:''}}]}
"have" is true when the item is on their list or in their staples (in a big enough amount), false when they need to buy it. "aisle" is one of: ${AISLES.join(', ')}.`;
}

/* ---------- start ---------- */
(async function init(){
  paintMe();paintTabs();render();
  let db=null;try{db=await claude.use('db')}catch(e){}
  if(!db){S.ready=true;render();return}
  S.db=db;
  const seen={};let pend=false;
  const soon=()=>{if(pend)return;pend=true;setTimeout(()=>{pend=false;render()},0)};
  const sub=name=>db.collection(name).onSnapshot(s=>{const o={};s.docs.forEach(d=>{if(d.exists)o[d.id]=d.data()});const j=JSON.stringify(o);if(seen[name]===j)return;seen[name]=j;S[name]=o;S.ready=true;soon()},()=>{});
  sub('requests');sub('plan');sub('shopsend');sub('freezer');sub('staples');sub('drafts');
  try{S.sample=await claude.use('sample')}catch(e){S.sample=null}
  render();
  if(!S.me)pickMe();
})();

function reqBlock(r){
  const who=person(r.by),when=r.at?new Date(r.at):null;
  const what=[r.methods&&r.methods.length?r.methods.join(', '):'',r.prefs&&r.prefs.length?r.prefs.join(', '):'',+r.batches>1?r.batches+' batches':''].filter(Boolean).join(' · ');
  const head=`<div class="reqh"><span class="av" style="background:${who.colour}">${esc(who.name[0])}</span><div class="t"><b>${esc(who.name)} asked${when?' '+DOW[when.getDay()]+' '+nice(when):''}${what?': '+esc(what):''}</b><small>${esc(r.pantry||'')}</small></div>${r.state==='done'||r.state==='error'?`<button class="link" data-redo="${esc(r.id)}">Ask again</button>`:''}</div>`;
  let body='';
  if(S.thinking[r.id]||r.state==='thinking')body=`<div class="status"><span class="spin"></span>Claude is coming up with ideas. This takes about 30 seconds.</div>`;
  else if(r.state==='queued')body=`<div class="status"><span class="spin"></span>Sent to Claude. Ideas will be here within the hour and you'll get a notification.</div>`;
  else if(r.state==='error')body=`<div class="status err">Claude couldn't come up with ideas for this one${r.error?': '+esc(r.error):''}. Tap Ask again.</div>`;
  else{const pl=plannedTitles();body=`<div class="opts">${(r.options||[]).map((o,i)=>optCard(r.id,i,o,pl.has(o.title))).join('')}</div>`}

async function ask(){
  if(needMe())return;
  const pantry=$('#pan').value.trim(),notes=$('#notes').value.trim();
  if(!pantry&&!S.methods.size&&!S.prefs.size&&!notes&&!staplesList().length){toast('Tell Claude what you have, or how you want to cook');$('#pan').focus();return}
  const r={by:S.me,at:nowIso(),pantry:pantry.slice(0,3000),methods:[...S.methods],prefs:[...S.prefs],notes:notes.slice(0,500),staples:staplesText(),serves:SERVES,batches:S.prefs.has('Freezer-friendly')?S.batches:1,count:6,state:S.sample?'thinking':'queued'};
  const id=rid();
  if(!await write(db=>db.doc('requests/'+id).set(r)))return;

function redo(id){const r=S.requests[id];if(!r)return;$('#pan').value=r.pantry||'';store.set('mp-pantry',r.pantry||'');$('#notes').value=r.notes||'';store.set('mp-notes',r.notes||'');
  S.methods=new Set(r.methods||[]);S.prefs=new Set(r.prefs||[]);if(r.batches){S.batches=+r.batches;store.set('mp-batches',S.batches)}store.set('mp-methods',JSON.stringify([...S.methods]));store.set('mp-prefs',JSON.stringify([...S.prefs]));render();scrollTo({top:0,behavior:'smooth'});toast('Change anything you like, then tap Get recipe ideas')}
function clean(o,b){b=Math.max(1,Math.min(3,+b||1));
  const s=(x,n)=>String(x==null?'':x).slice(0,n);
  return {title:s(o.title,90),why:s(o.why,220),method:s(o.method,30),time:s(o.time,40),tags:(o.tags||[]).slice(0,5).map(t=>s(t,30)),uses:(o.uses||[]).slice(0,20).map(t=>s(t,60)),
    ingredients:(o.ingredients||[]).slice(0,30).map(x=>({item:s(x.item,80),qty:s(x.qty,40),have:!!x.have,aisle:AISLES.includes(x.aisle)?x.aisle:'Other'})),steps:(o.steps||[]).slice(0,12).map(t=>s(t,400)),serves:SERVES,batches:b,makes:SERVES*b,
    freezer:o.freezer&&(o.freezer.portion||o.freezer.reheat)?{portion:s(o.freezer.portion,300),keeps:s(o.freezer.keeps,60),reheat:s(o.freezer.reheat,400)}:null};
}
async function generate(id,r){
  S.thinking[id]=true;render();
  try{
    const out=await S.sample.json(recipePrompt(r),{cache:false});
    const opts=(out&&out.options||[]).filter(o=>o&&o.title).map(o=>clean(o,r.batches));
    if(!opts.length)throw {code:'empty'};
    await S.db.doc('requests/'+id).set(Object.assign({},r,{state:'done',options:opts,doneAt:nowIso(),via:'claude'}));
  }catch(e){
    // Couldn't answer here: hand it to the scheduled task instead of losing it.
    await S.db.doc('requests/'+id).set(Object.assign({},r,{state:'queued'})).catch(()=>{});
    toast(e&&e.code==='not_granted'?'Claude wasn\'t allowed here, so it\'s been sent. Ideas within the hour.':'Claude is busy, so it\'s been sent. Ideas within the hour.');
  }finally{delete S.thinking[id];render()}
}

/* ---------- recipe sheet and night picker ---------- */
/* Prep reminders for a planned dinner: from the recipe's own prep notes, or worked out from how it's cooked.
   The scheduled task uses the same rules when it copies the plan into the Family Hub. Dinner is about 6pm. */
const DINNER_H=18;
function clockTxt(h){const t=Math.round(Math.max(5,h)*4)*15,hh=Math.floor(t/60),mm=t%60;return (hh%12||12)+(mm?':'+pad(mm):'')+(hh<12?'am':'pm')}
function prepFor(r){
  if(!r)return {};const p=Object.assign({},r.prep||{});
  if(r.fromFreezer&&!p.nightBefore)p.nightBefore='Take '+r.title+' out of the freezer to thaw in the fridge';
  if(!p.morning&&!p.afternoon&&/slow cook/i.test(r.method||'')){const m=String(r.time||'').match(/(\d+(?:\.\d+)?)\s*(?:-\s*\d+\s*)?(?:hrs?|hours?)/i);
    if(m){const st=DINNER_H-parseFloat(m[1])-0.5;const t='Slow cooker on by '+clockTxt(st)+' ('+r.title+')';if(st<12)p.morning=t;else p.afternoon=t}}
  return p;
}

/* ---------- This week ---------- */
/* Claude's draft for a week lives in drafts/<monday>: {week, state queued|working|done|error, by, at, note,
   nights:{date: recipe + why + prep}, days:{date:{busy, weather, out, taken}}, used:[dates], dropped:[dates]}.
   The scheduled task fills it (it can see the Family Hub calendar, who's home and the forecast). */
function draftFor(k){return S.drafts[k]||null}
function suggestionFor(k,dk){const dr=draftFor(k),p=planFor(k);if(!dr||dr.state!=='done'||(p.nights||{})[dk])return null;
  if((dr.used||[]).includes(dk)||(dr.dropped||[]).includes(dk))return null;return (dr.nights||{})[dk]||null}
const stripSug=o=>{const x=Object.assign({},o);delete x.suggested;return x};
async function useSuggestions(dks){
  if(needMe())return false;const k=ymd(monday(fromYmd(dks[0]))),p=planFor(k),dr=draftFor(k);if(!dr)return false;
  const n=Object.assign({},p.nights),fz={},took=[];
  for(const dk of dks){const o=suggestionFor(k,dk);if(!o)continue;n[dk]=Object.assign(stripSug(o),{by:S.me,at:nowIso(),fromDraft:true});took.push(dk);if(o.fromFreezer)fz[o.fromFreezer]=(fz[o.fromFreezer]||0)-1}
  if(!took.length)return false;
  const ok=await write(async db=>{
    await db.doc('plan/'+k).set(Object.assign({skip:[],sent:[]},p,{week:k,nights:n,updatedBy:S.me,updatedAt:nowIso()}));
    await db.doc('drafts/'+k).set(Object.assign({},dr,{used:[...new Set([...(dr.used||[]),...took])]}));
    for(const [id,d] of Object.entries(fz)){const f=S.freezer[id];if(!f)continue;const left=(+f.portions||0)+d;if(left<=0)await db.doc('freezer/'+id).delete();else await db.doc('freezer/'+id).set(Object.assign({},f,{portions:left}))}
  });
  if(ok)toast(took.length===1?n[took[0]].title+' is on '+DOWL[fromYmd(took[0]).getDay()]:took.length+' dinners added to the plan');
  return ok;
}
async function dropSuggestion(dk){if(needMe())return false;const k=ymd(monday(fromYmd(dk))),dr=draftFor(k);if(!dr)return false;
  return write(db=>db.doc('drafts/'+k).set(Object.assign({},dr,{dropped:[...new Set([...(dr.dropped||[]),dk])]})))}
function askDraft(k){
  if(needMe())return;const dr=draftFor(k),d0=fromYmd(k);
  openSheet(`<h2>Plan ${k===ymd(monday(new Date()))?'this week':'the week of '+nice(d0)} for me</h2>
   <p class="sub">Claude fills every free night around the Family Hub calendar, who's home, the weather, the freezer and your staples. You then keep or swap each one.</p>
   <label class="label" for="dN">Anything Claude should know? (optional)</label>
   <input id="dN" value="${esc(dr&&dr.note||'')}" placeholder="e.g. use the lamb, Laura's away Wednesday, cheap week" autocomplete="off">
   <div class="actions"><span class="grow"></span><button class="btn" id="dGo">${svg('spark')}Plan it</button></div>
   <p class="hint" style="margin-top:12px">It'll be ready within the hour and you'll get a notification.</p>`);
  $('#dGo').onclick=async()=>{const note=$('#dN').value.trim().slice(0,400);
    if(await write(db=>db.doc('drafts/'+k).set({week:k,state:'queued',by:S.me,at:nowIso(),note,nights:{},days:{},used:[],dropped:[]}))){closeSheet();toast('Sent. Your week will be planned within the hour.')}};
}
function prepLines(d){
  const dk=ymd(d),r=(planFor(ymd(monday(d))).nights||{})[dk],nk=ymd(addDays(d,1)),nr=(planFor(ymd(monday(addDays(d,1)))).nights||{})[nk];
  const out=[],p=prepFor(r),np=prepFor(nr);
  if(p.morning)out.push(p.morning);if(p.afternoon)out.push(p.afternoon);
  if(np.nightBefore)out.push('Tonight: '+np.nightBefore.replace(/^./,c=>c.toLowerCase())+' for tomorrow');
  return out.map(t=>`<span class="prep">${svg(/freezer|thaw/i.test(t)?'snow':'clock')}${esc(t)}</span>`).join('');
}
function dayCtx(dr,dk){const c=dr&&dr.days&&dr.days[dk];if(!c)return'';
  const bits=[c.busy,c.weather,c.out&&c.out.length?'Out: '+c.out.map(id=>person(id).name).join(', '):''].filter(Boolean);
  return bits.length?`<span class="ctx">${esc(bits.join(' · '))}</span>`:''}
function viewWeek(v){
  const k=weekKey(),p=planFor(k),days=[...Array(7)].map((_,i)=>addDays(S.week,i)),t=today(),dr=draftFor(k);
  const n=Object.keys(p.nights||{}).length,dks=days.map(ymd),sugs=dks.filter(dk=>suggestionFor(k,dk));
  const past=ymd(addDays(S.week,6))<t,busy=dr&&(dr.state==='queued'||dr.state==='working');
  let box='';
  if(busy)box=`<div class="status"><span class="spin"></span>Claude is planning this week around the calendar, the weather and the freezer. It'll be ready within the hour.</div>`;
  else if(sugs.length)box=`<section class="card draftcard"><h2>Claude's plan for this week</h2><p class="hint" style="margin:-4px 0 12px">${sugs.length} suggestion${sugs.length===1?'':'s'} below. Keep the ones you like, cross off the rest${dr.note?'. You asked: '+esc(dr.note):''}.</p>
    <div class="row"><button class="btn" id="useAll">${svg('check')}Keep all ${sugs.length}</button><button class="link" id="reDraft">Plan it again</button></div></section>`;
  else if(dr&&dr.state==='error')box=`<div class="status err">Claude couldn't plan this week${dr.error?': '+esc(dr.error):''}. <button class="link" id="reDraft">Try again</button></div>`;
  else if(n<7&&!past)box=`<button class="btn wide" id="draftBtn" style="margin-bottom:14px">${svg('spark')}Plan ${n?'the rest of ':''}this week for me</button>`;
  v.innerHTML=`<h1>This week's dinners</h1><p class="lede">${n?`${n} of 7 nights planned.`:'Nothing planned yet.'} Tap a night to see the recipe and prep reminders.</p>
  <div class="wk"><button class="round" id="wPrev" aria-label="Previous week">${svg('left')}</button><b>${nice(days[0])} to ${nice(days[6])}</b><button class="round" id="wNext" aria-label="Next week">${svg('right')}</button></div>
  ${box}
  <section class="card flush">${days.map(d=>{const dk=ymd(d),r=(p.nights||{})[dk],sg=suggestionFor(k,dk),c=dr&&dr.days&&dr.days[dk];
    const day=`<span class="d"><b>${DOW[d.getDay()]}</b><span>${d.getDate()}</span></span>`;
    if(sg)return `<div class="night sug${dk===t?' today':''}">${day}<span class="w"><button class="open" data-sg="${dk}"><span class="sugt">Suggested</span><b>${sg.fromFreezer?svg('snow')+' ':''}${esc(sg.title)}</b><small>${esc([sg.method,sg.time].filter(Boolean).join(' · '))}${sg.why?' · '+esc(sg.why):''}</small>${dayCtx(dr,dk)}</button>
      <span class="sugacts"><button class="btn sm" data-keep="${dk}">${svg('check')}Keep</button><button class="btn sm ghost" data-drop="${dk}">${svg('x')}Not this</button></span></span></div>`;
    return `<button class="night${dk===t?' today':''}" data-n="${dk}">${day}<span class="w">${r?`<b>${r.fromFreezer?svg('snow')+' ':''}${esc(r.title)}</b><small>${[r.method,r.time,+r.batches>1&&!r.fromFreezer?'makes '+(r.makes||r.batches*SERVES):''].filter(Boolean).map(esc).join(' · ')}${r.by?' · added by '+esc(person(r.by).name):''}</small>`:c&&c.taken?`<b class="taken">${esc(c.taken)}</b><small>Already in the Family Hub</small>`:'<span class="empty">Nothing yet</span>'}${dayCtx(dr,dk)}${prepLines(d)}</span>${svg('right')}</button>`}).join('')}</section>
  ${n?`<button class="btn dark wide" id="toBuy">${svg('cart')}See what to buy</button>`:''}`;
  $('#wPrev').onclick=()=>{S.week=addDays(S.week,-7);render()};$('#wNext').onclick=()=>{S.week=addDays(S.week,7);render()};
  const tb=$('#toBuy');if(tb)tb.onclick=()=>goTab('buy');
  const db_=$('#draftBtn');if(db_)db_.onclick=()=>askDraft(k);
  const rd=$('#reDraft');if(rd)rd.onclick=()=>askDraft(k);
  const ua=$('#useAll');if(ua)ua.onclick=()=>useSuggestions(sugs);
  v.querySelectorAll('[data-keep]').forEach(b=>b.onclick=()=>useSuggestions([b.dataset.keep]));
  v.querySelectorAll('[data-drop]').forEach(b=>b.onclick=()=>dropSuggestion(b.dataset.drop));
  v.querySelectorAll('[data-sg]').forEach(b=>b.onclick=()=>showRecipe(suggestionFor(k,b.dataset.sg),{keep:b.dataset.sg}));
  v.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const dk=b.dataset.n,r=(p.nights||{})[dk];
    if(r)showRecipe(r,{night:dk});else{goTab('ideas');toast('Pick an idea, then choose '+DOWL[fromYmd(dk).getDay()])}});
}

/* ---------- To buy ---------- */
const norm=s=>String(s||'').toLowerCase().replace(/\s+/g,' ').trim().replace(/(es|s)$/,'');
function toBuy(){
  const k=weekKey(),p=planFor(k),skip=new Set(p.skip||[]),sent=new Set(p.sent||[]),m={};
  for(const [dk,r] of Object.entries(p.nights||{}).sort()){if(!r)continue;
    for(const x of r.ingredients||[]){if(x.have||!x.item)continue;const key=norm(x.item);
      const it=m[key]||(m[key]={key,item:x.item,aisle:x.aisle||'Other',qtys:[],meals:[]});
      if(x.qty)it.qtys.push(x.qty);const lab=DOW[fromYmd(dk).getDay()]+' '+r.title;if(!it.meals.includes(lab))it.meals.push(lab)}}
  for(const s of staplesList()){if(!s.low)continue;const key=norm(s.item);
    if(m[key]){m[key].meals.push('running low in the pantry');m[key].staple=s.id;continue}
    m[key]={key,item:s.item,aisle:stapleAisle(s),qtys:[],meals:['Running low in the pantry'],staple:s.id}}
  return Object.values(m).map(i=>Object.assign(i,{qty:sumQty(i.qtys),on:!skip.has(i.key),sent:sent.has(i.key)}));
}
/* "1" + "2" -> "3"; "400 ml" + "400 ml" -> "800 ml"; anything else is listed as given. */
function sumQty(q){if(!q.length)return'';const p=q.map(x=>String(x).trim().match(/^(\d+(?:\.\d+)?)\s*([a-zA-Z]*)$/));
  if(p.every(Boolean)&&new Set(p.map(m=>m[2].toLowerCase())).size===1){const t=p.reduce((a,m)=>a+parseFloat(m[1]),0);return (Math.round(t*100)/100)+(p[0][2]?' '+p[0][2]:'')}
  return q.join(' + ')}
function viewBuy(v){
  const k=weekKey(),p=planFor(k),items=toBuy(),days=[...Array(7)].map((_,i)=>addDays(S.week,i));
  const todo=items.filter(i=>i.on&&!i.sent);
  const sends=list(S.shopsend).filter(s=>s.week===k).sort((a,b)=>(b.at||'').localeCompare(a.at||''));
  const waiting=sends.find(s=>s.state==='queued'),last=sends.find(s=>s.state==='done');
  const groups=AISLES.map(a=>[a,items.filter(i=>i.aisle===a)]).filter(g=>g[1].length);
  v.innerHTML=`<h1>To buy</h1><p class="lede">Everything the week's dinners need that you don't already have, plus pantry staples marked Low. It all goes onto the Family Hub shopping list by itself about 2 hours after a dinner is planned, so untick anything you've already got before then (or tap Send now).</p>
  <div class="wk"><button class="round" id="bPrev" aria-label="Previous week">${svg('left')}</button><b>${nice(days[0])} to ${nice(days[6])}</b><button class="round" id="bNext" aria-label="Next week">${svg('right')}</button></div>
  ${waiting?`<div class="note wait">${waiting.items.length} item${waiting.items.length===1?'':'s'} on the way to the Family Hub shopping list. ${S.sample?'They\'ll be there within the hour.':'They\'ll be there within the hour.'}</div>`:last?`<div class="note">${last.added!=null?last.added:last.items.length} item${(last.added!=null?last.added:last.items.length)===1?'':'s'} added to the Family Hub Supermarket list${last.doneAt?' '+DOW[new Date(last.doneAt).getDay()]+' '+nice(new Date(last.doneAt)):''}.</div>`:''}
  ${items.length?`<section class="card flush">${groups.map(([a,its])=>`<div class="aisle">${esc(a)}</div>${its.map(i=>`<button class="item${i.sent?' sent':''}" data-it="${esc(i.key)}" aria-pressed="${i.on}" ${i.sent?'disabled':''}><span class="box">${i.on?svg('check'):''}</span><span class="txt"><b>${esc(i.item)}</b><small>${i.sent?'On the Family Hub list · ':''}${esc(i.meals.join(', '))}</small></span><span class="q">${esc(i.qty)}</span></button>`).join('')}`).join('')}</section>
   <div class="sendbar"><button class="btn wide" id="send" ${todo.length?'':'disabled'}>${svg('cart')}${todo.length?`Send ${todo.length} item${todo.length===1?'':'s'} to the Family Hub now`:'All on the Family Hub list'}</button></div>`
   :`<div class="card emptybox"><b>Nothing to buy yet</b>${Object.keys(p.nights||{}).length?'Everything this week uses what you have.':'Put some recipes on this week first.'}</div>`}`;
  $('#bPrev').onclick=()=>{S.week=addDays(S.week,-7);render()};$('#bNext').onclick=()=>{S.week=addDays(S.week,7);render()};
  v.querySelectorAll('[data-it]').forEach(b=>b.onclick=()=>{if(needMe())return;const key=b.dataset.it,pp=planFor(k),s=new Set(pp.skip||[]);s.has(key)?s.delete(key):s.add(key);
    write(db=>db.doc('plan/'+k).set(Object.assign({sent:[]},pp,{week:k,skip:[...s],updatedBy:S.me,updatedAt:nowIso()})))});
  const sb=$('#send');if(sb)sb.onclick=async()=>{if(needMe()||!todo.length)return;sb.disabled=true;
    const payload=todo.map(i=>({text:i.item,qty:i.qty.slice(0,40),aisle:i.aisle,note:('For '+i.meals.join(', ')).slice(0,120)}));
    const pp=planFor(k);
    const ok=await write(async db=>{await db.doc('shopsend/'+rid()).set({week:k,items:payload,by:S.me,at:nowIso(),state:'queued'});
      await db.doc('plan/'+k).set(Object.assign({skip:[]},pp,{week:k,sent:[...new Set([...(pp.sent||[]),...todo.map(i=>i.key)])],updatedBy:S.me,updatedAt:nowIso()}));
      /* Staples sent to the shopping list stop showing as low: they're on their way. */
      for(const i of todo){const st=i.staple&&S.staples[i.staple];if(st)await db.doc('staples/'+i.staple).set(Object.assign(stData(st),{low:false,by:S.me,at:nowIso()}))}});
    if(ok)toast('Sent. They\'ll be on the Family Hub list within the hour.');else sb.disabled=false};
}
</script>
