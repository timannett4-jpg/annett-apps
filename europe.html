nter, so check the app.", "food": [{"h": "Disneyland Park", "items": ["<b>Café Hyperion<\/b>, Discoveryland: burgers and nuggets, huge warm indoor hall", "<b>Casey’s Corner<\/b>, Main Street: hot dogs", "<b>Market House Deli<\/b>, Main Street: sandwiches and the Mickey pretzel sandwich", "<b>Casa de Coco<\/b>, Frontierland: Tex-Mex and churros", "<b>Hakuna Matata<\/b>, Adventureland: chicken and plantain fries", "<b>Colonel Hathi’s Pizza Outpost<\/b>, Adventureland", "<b>Toad Hall<\/b>, Fantasyland: fish and chips"]}, {"h": "Disney Adventure World", "items": ["<b>Stark Factory<\/b>, Avengers Campus: pizza and pasta", "<b>Super Diner<\/b> and <b>Fan-tastic Food Truck<\/b>, Avengers Campus", "<b>Nordic Crowns Tavern<\/b>, World of Frozen: sit-down feel, €22 to €24 menus", "<b>Café Luminosity<\/b>, Adventure Way", "<b>Hollywood Gardens<\/b> and <b>Ice Cream Creations<\/b>, World Premiere"]}], "remy": "<b>Anniversary dinner, Thursday 14 January.<\/b> Bistrot Chez Rémy is inside Disney Adventure World next to the Ratatouille ride, and you need a park ticket that day (ours covers it). Tables open two months ahead, about 14 November, and it is one of the hardest restaurants to get, so book on the day bookings open. Aim for about 5:30pm because the park closed at 7pm on January weekdays this year. Smart casual is fine. For the five of us expect about €200 (A$324) before drinks.", "showsLede": "Character meets mostly use a free virtual queue in the app, booked after you scan into the park.", "shows": [{"h": "Disney Tales of Magic", "t": "The castle show: fireworks and projections at park closing, every night. Stand on Main Street or the Central Plaza about 30 minutes before."}, {"h": "Disney Cascade of Lights", "t": "Adventure World’s new lake show with fountains, drones and fireworks. It runs at the same time as the castle show, and may not run on 7pm-close winter nights."}, {"h": "Disney Stars on Parade", "t": "Daily afternoon parade down Main Street. Claim a kerb spot 30 const aud=e=>'A$'+(Math.round(e*eurRate()*2)/2).toFixed(e*eurRate()<20?2:0);

function dRideCard(r){
  const g={ok:['ok','glasses','Glasses fine'],strap:['strap','strap','Strap recommended'],off:['off','strap','Strap or take off']}[r.g];
  const cam=r.film===2?`<span class="dB cam">${dIc('nocam')}No filming</span>`:r.film===1?`<span class="dB strap">${dIc('cam')}Wear, no video</span>`:`<span class="dB camok">${dIc('cam')}Meta glasses OK</span>`;
  return `<div class="dRide${r.closed?' closed':''}" data-park="${r.p}">
    <div class="dRideT"><b>${esc(r.n)}</b><small>${esc(r.land)}</small></div>
    <div class="dBadges">${r.closed?`<span class="dB off">${dIc('x')}Closed that week</span>`:`<span class="dB ${g[0]}">${dIc(g[1])}${g[2]}</span>${cam}`}
      <span class="dB h">${dIc('ruler')}${r.h?r.h+' cm min':'Any height'}</span>
      <span class="dB i">${dIc('bolt')}${esc(r.i)}</span></div>
    <p>${esc(r.t)}</p></div>`;
}
const dSec=(id,ic,t,lede,body)=>`<section class="dSec" id="d-${id}"><div class="dSecH">${dIc(ic)}<h2>${t}</h2></div>

const dUl=(cls,ic,items)=>`<ul class="dList ${cls}">${items.map(x=>`<li>${dIc(ic)}<span>${x}</span></li>`).join('')}</ul>`;

  if(s.dfilt){local.dFilt=s.dfilt;saveLocal();const y=scrollY;render();scrollTo(0,y);return}
  if(s.dk!==undefined){local.dPack=local.dPack||{};local.dPack[s.dk]=!local.dPack[s.dk];saveLocal();t.setAttribute('aria-pressed',!!local.dPack[s.dk]);return}
});

function render(){
  const V_=document.getElementById('view');
  document.body.dataset.view=cur;
  V_.innerHTML=(V[cur]||V.today)();
  riffle(V_);
  const nf=DAYS.reduce((a,d)=>a+flagsFor(d).length,0);
  const fb=document.getElementById('btnFix');
  if(fb){fb.firstElementChild.textContent=nf;fb.hidden=!nf;
    fb.setAttribute('aria-label',nf+' things to sort with Amy')}
  document.querySelectorAll('#navIn button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===cur));
  const d=(cur==='today'&&local.daySel?DAYS.find(x=>x.date===local.daySel):null)||currentDay();
  document.getElementById('bTitle').textContent=d?d.cityName:'Europe 2027';
  document.getElementById('bSub').textContent=d?'Day '+(dayIndex(d)+1)+' of '+DAYS.length:'29 Dec – 12 Feb';
  clock(); if(cur==='money')conv();
  const sd=document.querySelector('.sd.on');
  if(sd&&sd.parentNode)sd.parentNode.scrollLeft=Math.max(0,sd.offsetLeft-sd.parentNode.clientWidth/2+22);
  const rb=document.querySelector('.rib .rb.sel'),rw=document.querySelector('.ribWrap');
  if(rb&&rw){const x=rb.getBBox().x+rb.getBBox().width/2;
    rw.scrollLeft=Math.max(0,x-rw.clientWidth/2)}
}
function go(t){cur=t;try{history.replaceState(null,'','#'+t)}catch(e){}window.scrollTo(0,0);render()}
function clock(){const d=currentDay(),tz=d?d.tz:D.trip.homeTz;
  document.getElementById('clk').textContent=hhmm(localMins(tz))}
setInterval(clock,20000);
function conv(){const a=document.getElementById('cvAmt'),c=document.getElementById('cvCur'),o=document.getElementById('cvOut');
  if(!a)return; const u=()=>{o.textContent='= A$'+((parseFloat(a.value)||0)*parseFloat(c.value)).toFixed(2)};
  a.addEventListener('input',u);c.addEventListener('change',u);u()}

async function boot(){
  try{DB=await claude.use('db')}catch(e){}
  try{ME=await claude.use('user')}catch(e){}
  try{ASSETS=await claude.use('assets')}catch(e){}
  try{SAMPLE=await claude.use('sample')}catch(e){}
  document.getElementById('fab').hidden=!SAMPLE;
  if(!DB)return; connected=true;
  if(ME){try{CANWRITE=(await ME.can('data.write'))!==false}catch(e){CANWRITE=true}}else CANWRITE=true;
  const sub=(c,k,o)=>{let q=DB.collection(c); if(o)q=q.orderBy(o,'desc').limit(300);
    q.onSnapshot(s=>{SHARED[k]=s.docs.map(d=>Object.assign({_id:d.id},d.data()));names();render()},()=>{})};
  sub('notes','notes','at');sub('spend','spend','at');sub('photos','photos','at');sub('asks','asks','at');
  sub('shop','shop','at');sub('jobs','jobs','at');sub('diary','diary','at');
  DB.collection('fixes').onSnapshot(s=>{SHARED.fixes={};
    s.docs.forEach(d=>SHARED.fixes[d.id]=d.data()||{});render()},()=>{});
  DB.collection('bookings').onSnapshot(s=>{SHARED.book={};s.docs.forEach(d=>SHARED.book[d.id]=d.data());render()},()=>{});
  DB.collection('packing').onSnapshot(s=>{SHARED.pack={};s.docs.forEach(d=>SHARED.pack[d.id]=d.data()||{});render()},()=>{});
  render();
}
async function names(){
  if(!ME||!ME.profiles)return;
  const ids=[...new Set([...SHARED.notes,...SHARED.spend,...SHARED.photos,...SHARED.asks,
    ...SHARED.shop,...SHARED.jobs,...SHARED.diary]
    .map(x=>x&&x.by).filter(Boolean))].filter(i=>!(i in NAMES));
  if(!ids.length)return;
  try{const ps=await ME.profiles(ids);ids.forEach(i=>NAMES[i]=(ps[i]&&ps[i].name)||'Someone');render()}
  catch(e){ids.forEach(i=>NAMES[i]='Someone')}
}
async function addDoc(coll,data){
  if(!DB)return;
  try{const id=await(ME&&ME.id?ME.id():null);
    await DB.collection(coll).add(Object.assign({by:id,at:new Date().toISOString()},data))}
  catch(e){toast('Could not save that. Check your signal.')}
}
let tT;
function toast(m){
  let el=document.getElementById('toast');
  if(!el){el=document.createElement('div');el.id='toast';document.body.appendChild(el)}
  el.textContent=m;el.hidden=false;clearTimeout(tT);tT=setTimeout(()=>el.hidden=true,2600);
}
function burst(x,y){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const cs=getComputedStyle(document.body);
  const cols=[cs.getPropertyValue('--amber'),cs.getPropertyValue('--cream'),cs.getPropertyValue('--green')];
  for(let i=0;i<14;i++){
    const s=document.createElement('i');
    const a=Math.random()*6.3,r=34+Math.random()*48;
    s.style.cssText='position:fixed;left:'+x+'px;top:'+y+'px;width:7px;height:7px;border-radius:2px;'+
      'z-index:60;pointer-events:none;background:'+cols[i%3].trim()+
      ';transition:transform .7s cubic-bezier(.1,.8,.3,1),opacity .7s';
    document.body.appendChild(s);
    requestAnimationFrame(()=>{s.style.transform='translate('+Math.cos(a)*r+'px,'+(Math.sin(a)*r+34)+'px) rotate('+(Math.random()*360)+'deg)';
      s.style.opacity='0'});
    setTimeout(()=>s.remove(),760);
  }
}

let IX=null;
function index(){
  const ix=[];
  DAYS.forEach(d=>{ix.push({t:d.cityName+' · '+d.label,s:d.title,tab:'today',day:d.date,
      q:[d.cityName,d.title,d.label,d.dow].join(' ')});
    d.slots.forEach(s=>ix.push({t:s.w,s:d.label+' at '+s.t,tab:'today',day:d.date,
      q:[s.w,s.d,s.b,d.cityName,d.label].join(' ')}))});
  D.stays.forEach(s=>ix.push({t:s.name,s:s.city+' · '+s.ref,tab:'stays',
    q:[s.name,s.city,s.ref,s.addr,s.note,s.kitchen].join(' ')}));
  ix.push({t:'Disneyland Paris guide',s:'Rides, glasses, rules, prices',tab:'disney',q:'disney disneyland paris rides glasses meta filming prices food water souvenirs bag rules chez remy '+DIS.rides.map(r=>r.n).join(' ')});
  D.travel.forEach(t=>ix.push({t:t.leg,s:t.svc,tab:'map',q:[t.leg,t.svc,t.detail,t.status].join(' ')}));
  D.sos.refs.forEach(r=>ix.push({t:r.v,s:r.k,tab:'sos',q:r.k+' '+r.v}));
  D.sos.contacts.forEach(c=>ix.push({t:c.detail,s:c.who,tab:'sos',q:c.who+' '+c.detail}));
  Object.keys(D.packing).forEach(w=>D.packing[w].forEach(it=>
    ix.push({t:it.i,s:w+' · '+it.s,tab:'kit',who:w,q:[it.i,it.n,it.s,w].join(' ')})));
  D.payments.filter(p=>p.what).forEach(p=>ix.push({t:p.what,s:p.to,tab:'money',q:[p.what,p.to,p.note].join(' ')}));
  return ix;
}
function search(term){
  const box=document.getElementById('hits');
  term=term.trim().toLowerCase();
  if(term.length<2){box.hidden=true;return}
  IX=IX||index();
  const h=IX.filter(x=>x.q.toLowerCase().includes(term)).slice(0,25);
  box.hidden=false;
  box.innerHTML=h.length?h.map((x,i)=>`<button class="hit" data-hit="${i}"><b>${esc(x.t)}</b><span>${esc(x.s)}</span></button>`).join('')
    :'<p class="muted" style="padding:12px 0">Nothing matches that.</p>';
  box._h=h;
}

let pendingDay=null;
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-tab],[data-jump],[data-chap],[data-fix],[data-kitmode],[data-shopadd],[data-shopwho],[data-shopdone],[data-shop],[data-kit],[data-pack],[data-chk],[data-copy],[data-hit],[data-base],[data-note],[data-spend],[data-photo],[data-l],[data-sug]');
  if(!t)return; const s=t.dataset;
  if(s.tab)return go(s.tab);
  if(s.l!==undefined){local.look=s.l||null;saveLocal();return applyLook()}
  if(s.kitmode){local.kitMode=s.kitmode;saveLocal();window.scrollTo(0,0);return render()}
  if(s.shopwho){local.shopWho=s.shopwho;saveLocal();return render()}
  if(s.shopdone){local.shopDone=!local.shopDone;saveLocal();return render()}
  if(s.shopadd){
    const tx=document.getElementById('shTx');
    if(!tx||!tx.value.trim())return toast('Type something first.');
    const v=tx.value.trim(); tx.value='';
    return addDoc('shop',{text:v,who:local.shopWho||'Everyone',done:false})}
  if(s.shop){
    const it=(SHARED.shop||[]).find(x=>x._id===s.shop); if(!it)return;
    if(!DB||!CANWRITE)return toast('Not connected.');
    const nd=!it.done, r=t.getBoundingClientRect();
    const id=await(ME&&ME.id?ME.id():null);
    it.done=nd; it.doneBy=nd?id:null; it.doneAt=nd?new Date().toISOString():null;
    if(nd)burst(r.left+20,r.top+16);
    render();
    try{await DB.doc('shop/'+s.shop).set({text:it.text,who:it.who||'Everyone',by:it.by,at:it.at,
      done:nd,doneBy:it.doneBy,doneAt:it.doneAt})}catch(e){toast('Could not save that.')}
    return}
  if(s.kit){local.kitWho=s.kit;saveLocal();return render()}
  if(s.base){local.mapSel=local.mapSel===s.base?null:s.base;saveLocal();return render()}
  if(s.fix){
    const cur=(SHARED.fixes[s.fix]||{}).state||'open';
    const nxt=cur==='open'?'raised':cur==='raised'?'done':'open';
    if(!DB||!CANWRITE)return toast('Not connected.');
    const id=await(ME&&ME.id?ME.id():null);
    SHARED.fixes[s.fix]={state:nxt,by:id,at:new Date().toISOString()};
    if(nxt==='done'){const r=t.getBoundingClientRect();burst(r.left+20,r.top+14)}
    render();
    try{await DB.doc('fixes/'+s.fix).set(SHARED.fixes[s.fix])}catch(e){toast('Could not save that.')}
    return}
  if(s.chap!==undefined){local.chapSel=+s.chap;saveLocal();window.scrollTo(0,0);return render()}
  if(s.jump){local.daySel=s.jump;saveLocal();
    const i=DAYS.findIndex(d=>d.date===s.jump),chs=chapters();
    local.chapSel=chs.findIndex(c=>i>=c.a&&i<=c.b); saveLocal();
    if(cur!=='today')return go('today');
    window.scrollTo({top:0,behavior:'smooth'});return render()}
  if(s.chk!==undefined){const k='chk:'+s.chk;local[k]=!local[k];saveLocal();
    t.setAttribute('aria-pressed',!!local[k]);
    if(local[k]){const r=t.getBoundingClientRect();burst(r.left+20,r.top+16)}return}
  if(s.pack!==undefined){
    const who=local.kitWho||'Tim',i=+s.pack,r=t.getBoundingClientRect();
    if(connected&&CANWRITE){const st=Object.assign({},SHARED.pack[who]||{});
      const nv=!st['i'+i]; st['i'+i]=nv; SHARED.pack[who]=st; if(nv)burst(r.left+20,r.top+16); render();
      try{await DB.doc('packing/'+who).set(st)}catch(err){toast('Could not save that.')}}
    else{const k='pk:'+who+':'+i;local[k]=!local[k];saveLocal();if(local[k])burst(r.left+20,r.top+16);render()}
    return}
  if(s.note!==undefined){const tx=document.getElementById('noteTx');
    if(!tx||!tx.value.trim())return; const v=tx.value.trim();tx.value='';
    return addDoc('notes',{day:s.note,text:v})}
  if(s.spend!==undefined){
    const l=document.getElementById('spLabel'),a=document.getElementById('spAmt'),
      c=document.getElementById('spCur'),amt=parseFloat(a.value);
    if(!l.value.trim()||!amt)return toast('Needs a label and an amount.');
    const rate=c.value==='AUD'?1:(D.cash.find(x=>x.cur===c.value)||{rate:1}).rate;
    await addDoc('spend',{day:s.spend||(currentDay()||DAYS[0]).date,label:l.value.trim(),
      amt,cur:c.value,aud:+(amt*rate).toFixed(2)});
    l.value='';a.value='';return}
  if(s.photo!==undefined){pendingDay=s.photo;document.getElementById('photoInput').click();return}
  if(s.sug){document.getElementById('askTx').value=s.sug;return doAsk(s.sug)}
  if(s.copy){const txt=s.copy,old=t.textContent;
    const ok=()=>{t.textContent='COPIED';setTimeout(()=>{t.textContent=old},1400)};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,ok);
    else ok(); return}
  if(s.hit){const h=document.getElementById('hits')._h[+s.hit];
    document.getElementById('searchWrap').hidden=true;
    if(h.day){local.daySel=h.day;const i=DAYS.findIndex(d=>d.date===h.day),chs=chapters();
      local.chapSel=chs.findIndex(c=>i>=c.a&&i<=c.b)}
    if(h.who)local.kitWho=h.who;
    saveLocal();go(h.tab)}
});

document.getElementById('photoInput').addEventListener('change',async e=>{

    await addDoc('photos',{day:pendingDay,asset:r.id,person:local.me||''});toast('Photo added.')}
  catch(err){toast('That photo would not upload.')}
});
function shrink(file){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{const sc=Math.min(1,1400/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error('encode')),'image/jpeg',.84)};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('decode'))};
    img.src=url});
}
document.getElementById('btnSearch').addEventListener('click',()=>{

document.getElementById('q').addEventListener('input',e=>search(e.target.value));

function digest(){
  const L=['TRIP: the Annett family (Tim, Laura, Sienna 18, Erika 17, Archer 15) travel '
    +D.trip.start+' to '+D.trip.end+', 46 days Melbourne to Melbourne. Days 1-15 are a '
    +'Wanderers Australia junior hockey tour through England, Holland, Belgium and Paris; from '
    +'13 Jan they travel independently. Agent Amy Morrison, booking '+D.trip.booking
    +'. Sunrise and sunset are given because this is a European winter and the light is the '
    +'real constraint on each day.','\nDAY BY DAY'];
  DAYS.forEach((d,i)=>{
    L.push(`\n#${i+1} ${d.date} (${d.dow}) ${d.cityName} - ${d.title}`
      +(d.sun?` [light ${hhmm(d.sun[0])}-${hhmm(d.sun[1])}]`:''));
    d.slots.forEach(s=>L.push(`  ${s.t} ${s.w}${s.d?' - '+s.d:''}${s.b?' ['+s.b+']':''}`));
    warnFor(d.date).forEach(w=>L.push(`  !! ${w.sev.toUpperCase()}: ${w.txt}`))});
  L.push('\nBEDS');
  D.stays.forEach(s=>L.push(`${s.city}: ${s.name}, ${s.inn} to ${s.out}, ${s.nights} nights, ref ${s.ref}, ${s.addr}. ${s.kitchen?'Kitchen: '+s.kitchen+'. ':''}${s.note}`));
  L.push('\nTRAVEL LEGS');
  D.travel.forEach(t=>L.push(`${t.date} ${t.leg} (${t.svc}) - ${t.status}. ${t.detail}`
    +(t.window?` Window ${t.window}.`:'')+(t.est?` Budgeted $${t.est}.`:'')));
  L.push('\nMONEY (AUD): committed $'+D.totals.committed+', paid $'+D.totals.paid
    +', still to pay $'+D.totals.left+'. Outstanding: '
    +D.payments.filter(p=>p.paid==='No').map(p=>`${p.what} $${p.amt}`).join('; '));
  L.push('\nCASH: '+D.cash.map(c=>`${c.cur} = ${c.rate} AUD, `
    +(c.have?`have ${c.have}`:`get ${c.want} on arrival`)+`, for ${c.where}`).join('; '));
  L.push('\nINSURANCE: '+D.sos.insurance.insurer+' '+D.sos.insurance.policy+'. '
    +D.sos.insurance.cover+' '+D.sos.insurance.gap);
  if(SHARED.notes.length)L.push('\nFAMILY NOTES:\n'+SHARED.notes.slice(0,40).map(n=>`${n.day}: ${n.text}`).join('\n'));
  if(SHARED.spend.length)L.push('\nSPENT SO FAR: A$'
    +SHARED.spend.reduce((a,s)=>a+(+s.aud||0),0).toFixed(2)+' over '+SHARED.spend.length+' entries.');
  return L.join('\n');
}
const SUGS=['What do we do on the Sunday in Rome when the Vatican is shut?',
 'Which bookings are most urgent right now?','Three spare hours in Vienna. What is worth it?',
 'Where are we spending money we do not need to?',
 'A shopping list for the Florence apartment kitchen.'];
let busy=false,lastQ='',lastA='';
function openAsk(){
  document.getElementById('askSheet').hidden=false;
  const d=currentDay();
  document.getElementById('askSug').innerHTML=SUGS
    .concat(d?['What is left to do today in '+d.cityName+'?']:[])
    .map(s=>`<button data-sug="${esc(s)}">${esc(s)}</button>`).join('');
  const f=document.getElementById('askFeed'),items=SHARED.asks.slice(0,6);
  f.innerHTML=items.length?`<div class="sec">${secH('Asked before')}
    ${items.map(a=>`<div class="note"><b>${esc(a.q)}</b><div style="margin-top:6px">
      ${esc((a.a||'').slice(0,400))}${(a.a||'').length>400?'…':''}</div>
      <div class="who">${esc(whoName(a.by))} &middot; ${esc(when(a.at))}</div></div>`).join('')}</div>`:'';
  document.getElementById('askTx').focus();
}
async function doAsk(q){
  if(!SAMPLE||busy||!q.trim())return;
  busy=true;lastQ=q.trim();
  const out=document.getElementById('askOut'),g=document.getElementById('askGo');
  out.hidden=false;out.textContent='Thinking…';g.disabled=true;g.textContent='Asking…';
  document.getElementById('askSave').hidden=true;
  try{
    const r=await SAMPLE('You are helping the Annett family with their 46-day Europe trip. '
      +'Below is their full itinerary and bookings. Answer using it. Be specific and practical: '
      +'name the day, the time, the place and the cost where you can. Australian spelling, plain '
      +'words, no headings, under 250 words unless more is asked for. If the itinerary does not '
      +'say, say so rather than inventing it.\n\n=== ITINERARY ===\n'+digest()
      +'\n=== END ===\n\nQuestion: '+lastQ,
      {modelTier:'default',onText:({text})=>{out.textContent=text}});
    lastA=(r&&r.text)||out.textContent;out.textContent=lastA;
    if(DB&&CANWRITE)document.getElementById('askSave').hidden=false;
  }catch(e){
    out.textContent=e&&e.code==='rate_limited'?'Too many questions at once. Give it a minute.'
      :'That did not come back. Try again in a moment.';
  }
  busy=false;g.disabled=false;g.textContent='Ask';
}
document.getElementById('fab').addEventListener('click',openAsk);
document.getElementById('askClose').addEventListener('click',()=>document.getElementById('askSheet').hidden=true);
document.getElementById('askSheet').addEventListener('click',e=>{if(e.target.id==='askSheet')e.currentTarget.hidden=true});
document.getElementById('askGo').addEventListener('click',()=>doAsk(document.getElementById('askTx').value));
document.getElementById('askTx').addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter')doAsk(e.target.value)});
document.getElementById('askSave').addEventListener('click',async e=>{
  e.target.hidden=true;await addDoc('asks',{q:lastQ,a:lastA});toast('Saved for everyone.')});

applyLook();
render();
boot();
